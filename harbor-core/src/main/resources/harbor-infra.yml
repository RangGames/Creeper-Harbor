# 서버마다 다른 인프라 설정. 게임 수치는 content/balance.yml에 둔다.
# DB·Redis 접속 정보를 서버 환경에 맞게 바꾼다.

server:
  id: main-1          # 프록시에 등록한 서버 이름과 같아야 한다 (소문자·숫자·-·_)
  role: main          # main · lobby · instance

dev: true             # 메인 스레드 DB·Redis 입출력 감지 경고

database:
  host: localhost
  port: 3306
  name: harbor
  user: harbor
  password: harbor
  # pool_size: 20     # 기본값: main 20, lobby·instance 8

redis:
  uri: redis://localhost:6379/0

season:
  id: 1
  start: 2027-09-01
  # 현재 시즌을 정하는 곳 (추가 제안). db = 시작할 때 season_meta의 ACTIVE 시즌을 쓰고 (시즌 전환 뒤 설정을
  # 고치지 않아도 됨), 행이 없으면 위 id·start를 쓴다. config = 위 id·start를 강제로 쓴다 (비상용)
  source: db

time:
  zone: Asia/Seoul
  daily_reset: "06:00"     # 제안값
  weekly_reset: MONDAY     # 제안값

# content_dir: /path/to/content   # 비우면 plugins/Harbor/content
lobby_server: lobby

# 로비에서 보내는 필수 리소스팩 (기본 팩 + 시즌 팩)
resource_packs: []
#  - id: base
#    url: https://cdn.example.com/harbor-base.zip
#    sha1: 0000000000000000000000000000000000000000

# 리소스팩 자동 빌드 (lobby 한 대에서만 켠다, 추가 제안).
# plugins/Harbor/pack/ 에 assets/<ns>/... (선택 pack.mcmeta·pack.png)를 넣으면, 서버 시작 때와 /harbor pack build 때
# 압축 → 바뀌었으면 CDN 업로드 → 모든 서버에 주소·SHA-1·모델/소리 목록을 알린다. lobby는 그 팩을 접속자에게 보낸다.
# pack:
#   build: true
#   # source: /path/to/assets-folder      # 비우면 plugins/Harbor/pack
#   format: "97.1"                          # pack.mcmeta가 없을 때 쓸 팩 형식
#   description: 크리퍼 항구
#   merge:                                # 같이 합칠 다른 리소스팩 (폴더·zip, 앞쪽 우선). plugins/Harbor/pack-merge/ 안의 팩은 자동
#     - plugins/SomePlugin/pack.zip
#   auto_merge: true                      # 설치된 플러그인이 만든 팩도 합친다 (ModelEngine·BetterModel·ItemsAdder·Nexo·Oraxen 기본 위치)
#   watch: true                           # 에셋 폴더·합칠 팩이 바뀌면 (예: /meg reload) 자동으로 다시 빌드·업로드
#   optimize: true                        # 무손실 최적화 (PackSquash 방식): JSON 압축, PNG 재압축, 이미 압축된 파일은 저장만
#   keep: []                              # 마인크래프트가 읽지 않지만 넣을 확장자 (기본은 README.md·.bbmodel·.psd 등을 뺌). 예: [bbmodel]
#   zip: pedantic                         # pedantic 표준 zip / balanced 같은 내용 파일 공유 / disregard 압축 해제 방지 (게임은 읽지만 일반 압축 프로그램은 잘 못 풂. 호스팅·백신이 의심할 수 있음)
#   cdn:
#     url: https://cdn.creeper.wiki
#     api_key: ""                           # CDN에서 발급한 키. 이 파일은 커밋하지 않는다
#     namespace: creeper-harbor
#     version: "1.0"
