name: Harbor-Core
version: '${version}'
main: wiki.creeper.harbor.core.HarborCorePlugin
loader: wiki.creeper.harbor.core.HarborCoreLoader
bootstrapper: wiki.creeper.harbor.core.HarborCoreBootstrap
api-version: '${apiVersion}'
description: '크리퍼 항구 공통 플러그인 (콘텐츠, 플레이어 데이터, 재화, 아이템, 보정자, 메시지, 명령어)'
website: https://creeper.wiki
permissions:
  harbor.admin:
    description: /harbor 관리 명령
    default: op
  harbor.admin.alerts:
    description: 원장 불일치 등 운영 알림 받기
    default: op
  harbor.admin.furniture:
    description: /harbor furniture (가구 목록·지급)
    default: op
  harbor.furniture.manage:
    description: 남이 놓은 가구도 회수 (웅크리고 우클릭)
    default: op
  harbor.admin.block:
    description: /harbor block (커스텀 블록 목록·지급)
    default: op
  harbor.gold:
    description: /골드 · /골드 순위 (내 잔액과 순위)
    default: true
  harbor.admin.gold:
    description: /골드 <플레이어> · 지급 · 회수 · 설정
    default: op
