# Harbor-Proxy 설정 (docs 20 1.3). 제안값은 CBT 지표를 보고 조정한다.

lobby: lobby                 # 첫 서버, 대기 공간 (잠금 없음)

main_servers:                # 본 서버와 수용 한도 (기본 150명)
  main-1: 150

instance_servers:            # 인스턴스 종류별 서버
  dungeon: []
  raid: []

queue:
  normal_share: 4            # 입장 4명 중 최소 1명은 일반 줄 (제안값)
  grace_seconds: 180         # 재접속 유예 3분 (제안값)
  per_second: 3              # 1초에 최대 입장 수
  tps_freeze: 18.0           # TPS가 이 아래면 한도 동결
  tps_resume: 19.5           # 이 이상 1분 유지되면 해제

priority: []                 # 우선 줄 UUID (CBT 운영진·테스터). 후원 등급은 Redis harbor:donor로 자동 (Common DonorTier)

login:
  lookup_timeout_ms: 1000    # 후원 등급·세션 잠금 조회 제한. 넘기면 기본값(후원 없음)으로 진행
  sanction_timeout_ms: 3000  # 제재 확인 제한. 넘기거나 DB 오류면 접속 거부 (제안값)

sanction:
  default_ban: perm          # 기간을 생략한 BAN (예: 30m, 12h, 7d, 2w, perm)
  default_mute: 1h           # 기간을 생략한 MUTE (제안값)

alt:
  window_days: 30            # 같은 IP 계정을 찾는 기간 (제안값)
  alert_accounts: 3          # 같은 IP 계정이 이 수 이상이면 운영진 알림 (제안값, 자동 차단 없음)

join_log:
  retention_days: 90         # 접속 기록 보관 기간 (제안값)

heartbeat:
  alert_seconds: 60          # 하트비트가 이만큼 끊기면 운영진 알림

links:                       # 일시정지 메뉴 서버 링크 (type: 바닐라 기본 이름, 또는 label: MiniMessage)
  - type: website
    url: https://creeper.wiki
  # - label: "<aqua>디스코드"
  #   url: https://discord.gg/...
  # - label: "<gold>후원 상점"
  #   url: https://...
  # - type: bug_report
  #   url: https://...

maintenance:
  bypass: []                 # 점검 중에도 들어올 수 있는 UUID
  fallback: false            # Redis가 없을 때 점검 상태

ip_hash_secret: change-me    # 접속 기록 IP 해시용 비밀 키 (반드시 바꾼다)

chat:
  repeat_limit: 3            # 같은 문장 연속 (제안값)
  lines_per_second: 3        # 1초 줄 수 (제안값)
  block_seconds: 3
  banned_words: []

messages:
  common:
    permanent: "영구"
    none: "-"
  motd:
    normal: "<gold><bold>크리퍼 항구</bold></gold> <gray>· 접속 <online>명 · 대기 <queue>명<newline><aqua>오늘도 바다로 나갈 시간입니다"
    maintenance: "<gold><bold>크리퍼 항구</bold></gold> <yellow>점검 중<newline><gray><reason> · 예상 종료 <until>"
  login:
    unavailable: "<red>접속 확인 중 문제가 생겼습니다. 잠시 뒤 다시 접속해 주세요."
  sanction:
    ban_kick: "<red>접속이 제한되었습니다.<newline><gray>사유: <reason><newline>만료: <until>"
    muted: "<red>채팅이 제한되었습니다. <gray>사유: <reason> · 만료 <until>"
    unmuted: "<green>채팅 제한이 풀렸습니다."
