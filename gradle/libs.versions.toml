[versions]
java = "25"
purpur = "26.3.build.2659-stable"
minecraft = "26.3"
velocity = "4.3.1"
hikaricp = "7.1.0"
mariadb = "3.5.11"
lettuce = "7.9.0.RELEASE"
flyway = "13.12.2"
snakeyaml = "2.2"
gson = "2.14.0"
jspecify = "1.0.1"
skript = "2.17.1"
placeholderapi = "2.12.3"
junit = "5.14.4"
testcontainers = "2.0.5"
errorprone = "2.52.0"
nullaway = "0.14.4"
# Gradle plugins (build-logic)
errorprone-plugin = "5.2.0"
nullaway-plugin = "3.3.0"
spotless-plugin = "8.9.0"
shadow-plugin = "9.6.1"
run-task-plugin = "3.1.0"

[libraries]
purpur-api = { module = "org.purpurmc.purpur:purpur-api", version.ref = "purpur" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
skript = { module = "com.github.SkriptLang:Skript", version.ref = "skript" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# build-logic only (plugin markers)
errorprone-gradle = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
nullaway-gradle = { module = "net.ltgt.nullaway:net.ltgt.nullaway.gradle.plugin", version.ref = "nullaway-plugin" }
spotless-gradle = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless-plugin" }
shadow-gradle = { module = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin", version.ref = "shadow-plugin" }
run-paper-gradle = { module = "xyz.jpenilla.run-paper:xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-task-plugin" }
run-velocity-gradle = { module = "xyz.jpenilla.run-velocity:xyz.jpenilla.run-velocity.gradle.plugin", version.ref = "run-task-plugin" }

[bundles]
# Libraries that Core's PluginLoader downloads from Maven at startup (not bundled in plugin jars)
server-runtime = ["hikaricp", "mariadb", "lettuce", "flyway-core", "flyway-mysql"]
