# 진주 보물함 확률표 (docs 20 12.3·12.4, '6. BM 기획' 3.4). 시즌 2 이후 기능 (shop.yml features.chest: false로 꺼 둠).
# rate는 백분율, 소수점 4자리까지. 합계는 정확히 100.0000%. 구성품은 availability: chest 코스메틱만.
# 표를 바꾸면 table_version을 올리고 바꾸기 전에 공지한다. 게임 안 확률표는 이 파일에서 그대로 만든다.
- id: chest/s2_tide
  name: 심연의 보물함
  season: 3                      # 시즌 2 이후 = 시즌 번호 3 (season/seasons.yml, 1 = CBT)
  price: {single: 150, ten: 1350}
  table_version: 1
  pity: {count: 50, grade: legendary}      # 50회 안에 최상위 등급 확정, 시즌 안에서 이월
  shards: {common: 1, rare: 3, epic: 8, legendary: 30}       # 중복 → 진주 조각 (제안값)
  exchange: {common: 10, rare: 30, epic: 80, legendary: 300} # 진주 조각 교환 가격 (제안값)
  entries:
    - {cosmetic: cosmetic/s2_chest_rod_abyss, grade: legendary, rate: "1.5000"}
    - {cosmetic: cosmetic/s2_chest_pet_otter, grade: epic, rate: "8.5000"}
    - {cosmetic: cosmetic/s2_chest_fx_spark, grade: rare, rate: "30.0000"}
    - {cosmetic: cosmetic/s2_chest_float_leaf, grade: common, rate: "60.0000"}
