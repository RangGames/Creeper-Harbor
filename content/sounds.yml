# 소리 이벤트 표 ('15. 사운드' 4·5장, 추가 제안). Core HarborSounds가 이 표로 소리를 고른다.
# 코드와 콘텐츠는 harbor:<이벤트>(리소스팩 assets/harbor/sounds.json 키)로 부르고, 리소스팩 소리를 쓸 수 없으면
# (balance.yml sounds.custom이 false이거나 resource_pack.yml 목록에 없음) fallback 바닐라 소리를 낸다.
#
#   source           소리 분류 = 클라이언트 음량 슬라이더 (master music record weather block hostile neutral player ambient voice ui)
#   volume · pitch   재생 음량·피치. 위치 소리는 16 × volume 블록 안의 플레이어에게만 간다 (보스·전설 입질은 3 이상, 4.3)
#   loop             반복 소리의 다시 재생 간격(틱) = 소리 길이. sounds.json에 반복 옵션이 없어 플러그인이 다시 내고, 끝나면 stopSound로 끊는다 (2장)
#   fallback         팩 소리를 못 쓸 때 낼 바닐라 소리. 없으면 소리 없음 (바닐라가 이미 같은 순간 소리를 내는 경우 등)
#   fallback_volume · fallback_pitch   대체 소리의 음량·피치 (없으면 volume·pitch)
# 음량은 제안값: UI는 작게(4.5), 효과음 1, 보스 3.

events:
  # 4.1 낚시 (모노, 찌·플레이어 위치에서)
  fishing.cast: {source: player}                                   # 바닐라 던지기 소리가 이미 나므로 대체 없음
  fishing.bobber_land: {source: player, volume: 0.8}
  fishing.bite: {source: player, fallback: "minecraft:entity.fishing_bobber.splash"}
  fishing.hook: {source: player, fallback: "minecraft:entity.fishing_bobber.retrieve"}
  fishing.reel_loop: {source: player, volume: 0.7, loop: 40}       # Shift 감는 동안 (2.0초)
  fishing.tension_warn: {source: player, fallback: "minecraft:block.note_block.bass", fallback_pitch: 0.6}
  fishing.line_snap: {source: player, fallback: "minecraft:entity.item.break"}
  fishing.reel_in: {source: player, fallback: "minecraft:entity.player.splash"}
  fishing.flop: {source: player, fallback: "minecraft:entity.cod.flop"}
  fishing.miss_big: {source: player, fallback: "minecraft:entity.generic.splash", fallback_pitch: 0.7}
  fishing.lava_cast: {source: player, fallback: "minecraft:block.lava.pop"}
  fishing.ice_hole: {source: player, fallback: "minecraft:block.glass.hit"}
  fishing.measure_tick: {source: player, volume: 0.4, fallback: "minecraft:block.note_block.hat", fallback_pitch: 1.6}   # 전설 계측 숫자가 올라가는 소리 (추가 제안)
  fishing.deep_rumble: {source: ambient, volume: 1.5, fallback: "minecraft:ambient.basalt_deltas.mood", fallback_pitch: 0.6}   # 전설 입질 대기 중 낮은 진동음 (추가 제안)

  # 4.2 포획 (등급별, 본인에게 2D. 전설 입질만 찌 위치에서 멀리까지)
  catch.common: {source: player, volume: 0.8}                      # 대체 없음: fishing.reel_in 대체음이 이미 남
  catch.rare: {source: player, fallback: "minecraft:entity.player.levelup"}
  catch.legendary_bite: {source: player, volume: 3.0, fallback: "minecraft:entity.lightning_bolt.thunder", fallback_volume: 1.0}
  catch.legendary: {source: player, fallback: "minecraft:ui.toast.challenge_complete"}
  catch.mythic: {source: player, fallback: "minecraft:ui.toast.challenge_complete"}
  catch.new_record: {source: player, fallback: "minecraft:entity.player.levelup", fallback_pitch: 1.2}

  # 4.3 보스 (포효는 보스 위치에서 volume 3, 범위 밖 참가자에게는 직접)
  boss.gnome.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.ravager.roar"}
  boss.moray.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.guardian.attack", fallback_pitch: 0.6}
  boss.fire_carp.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.blaze.shoot", fallback_pitch: 0.6}
  boss.white_sturgeon.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.elder_guardian.ambient"}
  boss.trench_squid.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.glow_squid.ambient", fallback_pitch: 0.5}
  boss.void_nebula.roar: {source: hostile, volume: 3.0, fallback: "minecraft:entity.ender_dragon.growl", fallback_pitch: 1.2}
  boss.trench_lord.roar: {source: hostile, volume: 4.0, fallback: "minecraft:entity.warden.roar"}
  boss.verdant_bolt.roar: {source: hostile, volume: 4.0, fallback: "minecraft:entity.lightning_bolt.thunder"}
  boss.harpoon_throw: {source: player}                             # 바닐라 삼지창 던지기 소리가 이미 남
  boss.harpoon_hit: {source: player, fallback: "minecraft:entity.player.attack.crit"}

  # 4.4 선박 · 이동
  ship.engine_loop: {source: neutral, loop: 80}                    # 4.0초. 원양 탐사선·나룻배는 ships.yml engine_pitch로 피치만 바꿈
  ship.icebreaker_loop: {source: neutral, loop: 80}
  ship.hull_hit: {source: neutral, fallback: "minecraft:block.wood.break", fallback_pitch: 0.7}
  ship.repair: {source: neutral, fallback: "minecraft:block.anvil.use", fallback_volume: 0.5}
  ship.bell: {source: neutral, fallback: "minecraft:block.bell.use"}
  travel.airship: {source: neutral, loop: 60}                      # 3.0초 루프

  # 4.5 UI · 시스템 (2D, 작게)
  ui.click: {source: ui, volume: 0.4, fallback: "minecraft:ui.button.click", fallback_volume: 0.25}
  ui.coin: {source: ui, volume: 0.6, fallback: "minecraft:entity.experience_orb.pickup", fallback_pitch: 1.4}
  ui.codex_register: {source: ui, volume: 0.7, fallback: "minecraft:ui.toast.challenge_complete", fallback_volume: 0.6, fallback_pitch: 1.2}
  ui.quest_complete: {source: ui, volume: 0.8, fallback: "minecraft:ui.toast.challenge_complete"}
  ui.level_up: {source: ui, volume: 0.8, fallback: "minecraft:entity.player.levelup"}
  ui.job_change: {source: ui, volume: 1.0, fallback: "minecraft:ui.toast.challenge_complete"}
  ui.mulbineul: {source: ui, volume: 0.6, fallback: "minecraft:block.amethyst_block.chime"}
  ui.error: {source: ui, volume: 0.5, fallback: "minecraft:entity.villager.no"}

  # 4.6 지역 배경음·환경음: World AmbienceManager가 world/ambience.yml대로 그 지역 플레이어에게 반복해서 낸다 (데이터팩 없음).
  #     배경음 loop = 곡 길이 (제안값, 곡이 정해지면 맞춘다). 대체 소리가 없으면 팩이 없을 때 조용하다
  music.harbor: {source: music, loop: 2400}
  music.swamp: {source: music, loop: 2400}
  music.coral: {source: music, loop: 2400}
  music.lava_lake: {source: music, loop: 2400}
  music.fjord: {source: music, loop: 2400}
  music.trench: {source: music, loop: 2400}
  music.void_sea: {source: music, loop: 2400}
  ambient.harbor: {source: ambient, loop: 400}
  ambient.swamp: {source: ambient, loop: 400}
  ambient.coral: {source: ambient, loop: 400}
  ambient.lava_lake: {source: ambient, loop: 400}
  ambient.fjord: {source: ambient, loop: 400}
  ambient.trench: {source: ambient, loop: 400}
  ambient.void_sea: {source: ambient, loop: 400}

  # 4.7 해상 이벤트
  event.storm_loop: {source: weather, volume: 0.8, loop: 400}      # 폭풍 해역에 있는 동안 (20초)
  event.ghost_ship: {source: hostile, fallback: "minecraft:block.bell.resonate"}
  event.migration: {source: ambient, fallback: "minecraft:entity.dolphin.splash"}
  event.announce: {source: ui, volume: 0.7}                         # 서버 공지 (전설·신기록·보스). 대체 없음

# 재화가 바뀌면 (커밋 뒤) 접속 중인 본인에게 낼 소리. reasons: 이 사유만 (비면 모두), except: 이 사유는 빼기, gain_only: 늘 때만
currency:
  gold:
    sound: "harbor:ui.coin"
    reasons: [FISH_SELL, ITEM_SELL, SHOP_BUY, BIG_DEAL_SELL, AUCTION_BUY, AUCTION_SALE, CRAFT_COST, REPAIR,
              SHIP_PURCHASE, SHIP_UPGRADE, HOUSING_DECOR, TRAP_SLOT_EXPAND]
  mulbineul:
    sound: "harbor:ui.mulbineul"
    gain_only: true
    except: [LEVEL_UP, QUEST_REWARD, CODEX_FIRST_CATCH]            # 레벨업·의뢰 완료·도감 등록 소리가 이미 남
