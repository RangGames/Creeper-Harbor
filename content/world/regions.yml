# Harbor-World 지역 확장 (docs 20 8.3, 모두 추가 제안). 지역 경계·진입 레벨·아이템은 regions.yml (Core RegionDef), 여기에는
# 같은 지역 ID로 World만 쓰는 필드를 둔다. 좌표는 맵 확정 전 제안값이다.
#
#   order            해금 순서 (1 항구 … 7 엔드). '해금한 가장 높은 지역'(의뢰 보상·통발 상한) 판정에 쓴다
#   hourly_gold      수동 낚시 시간당 골드 ('7. 밸런스 기획' 3.2). 해도 단계 보상 = 이 값 × world.chart.step_gold_ratio
#   server           이 지역 월드를 돌리는 서버 ID (비우면 지금 서버). 다른 서버면 ProxyBridge.requestMove로 옮긴다
#   spawn            안전 지점 (막힌 지역에서 접속했을 때, 정류장 도착 기본값)
#   unlock           RegionDef.unlock에 더하는 조건: flags(Quest가 장 보상으로 세운 플레이어 플래그), job_tier(전직 퀘스트),
#                    vehicle(탑승해야 하는 선박 ID), first_entry_only(탈것 조건은 첫 방문에만)
#   areas            세부 구역 [{id, bounds [[x, z]…], y_range [min, max]}] — 어종 area와 맞춘다
#   docks            정류장 [{id, kind: airship · dive · pier, x, y, z, yaw}]
#   stations         시설 [{id, type: shipyard · housing · decor_shop, x, y, z}]
#   treasure_sites   보물 위치 [{id, x, y, z, type}]
#   spot_candidates  물고기 떼 후보 [[x, y, z]…] (fishing_spots개를 골라 10~20분마다 옮긴다)
#   hidden_spots     숨은 낚시터 [{id, x, y, z}] (탐험 2차 '숨은 낚시터 감지'로만 보인다)
#   env              환경 디버프 [{type: cold · oxygen · heat, area, surface_y, depth}]
#   air_pockets      산소 회복 지점 [[x, y, z]…] (유적 공기 주머니)
#   ice_area         쇄빙선이 얼음을 깨는 세부 구역 ID

