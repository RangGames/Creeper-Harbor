# 해역 분위기 (데이터팩 없이 플러그인만, '4. 낚시 연출 & 보스전' 1.3 해역 분위기(화면·소리)·시간대 연출, 추가 제안).
# 그 지역에 있는 플레이어에게만 10틱마다 적용한다 (World AmbienceManager).
# 바이옴 안개 색·거리, 하늘 색, 조명 색은 데이터팩(바이옴 Environment Attributes)으로만 바꿀 수 있어서
# 리소스팩 post_effect(화면 색조·옅은 안개 느낌)와 파티클로 대신한다.
#
#   id           지역 ID
#   music        배경음 (sounds.yml의 loop 간격마다 다시 낸다. 다시 낼 때 바닐라 배경음은 끊는다)
#   ambient      환경음 루프 (sounds.yml loop)
#   post_effect  지역 화면 효과 (리소스팩 assets/<ns>/post_effect/<이름>.json, 26.3 Player#postEffects)
#   weather      개인 날씨 clear · downfall (비우면 월드 날씨)
#   particles    주변 파티클 [{type, count(10틱마다), radius, height: [아래, 위], water(물 표면에만), color(dust용 #RRGGBB)}]
#   phases       시간대 [{id, time: [시작틱, 끝틱](오버월드 시간, 24000을 넘으면 이어짐), fade(앞뒤로 서서히 바뀌는 틱),
#                particles, post_effect(절반 이상 들어왔을 때)}]
#                네더·엔드 지역도 오버월드 시간으로 판정한다
# 연출 강도 0(/낚시 설정 최소)이면 post_effect를 끄고 파티클을 절반으로 줄인다.

- id: region/harbor
  music: "harbor:music.harbor"
  ambient: "harbor:ambient.harbor"
  phases:
    - id: dawn_mist                    # 새벽 물안개
      time: [22300, 1500]
      fade: 800
      particles:
        - {type: cloud, count: 3, radius: 14, height: [-1, 1], water: true}
    - id: night_plankton               # 밤 야광 플랑크톤
      time: [13000, 23000]
      fade: 1200
      particles:
        - {type: dust, color: "#5ef2d6", count: 6, radius: 12, height: [-2, 1], water: true}
        - {type: glow, count: 2, radius: 10, height: [-2, 1], water: true}

- id: region/swamp
  music: "harbor:music.swamp"
  ambient: "harbor:ambient.swamp"
  post_effect: "harbor:swamp_haze"
  particles:
    - {type: spore_blossom_air, count: 3, radius: 12, height: [0, 6]}
  phases:
    - id: night_fireflies
      time: [12500, 23500]
      fade: 1000
      particles:
        - {type: firefly, count: 3, radius: 10, height: [0, 4]}

- id: region/coral_isles
  music: "harbor:music.coral"
  ambient: "harbor:ambient.coral"
  phases:
    - id: night_plankton
      time: [13000, 23000]
      fade: 1200
      particles:
        - {type: dust, color: "#7fd8ff", count: 6, radius: 12, height: [-2, 1], water: true}

- id: region/lava_lake                 # 붉은 조명 + 재 파티클
  music: "harbor:music.lava_lake"
  ambient: "harbor:ambient.lava_lake"
  post_effect: "harbor:lava_glow"
  particles:
    - {type: white_ash, count: 6, radius: 14, height: [0, 8]}
    - {type: ash, count: 4, radius: 12, height: [0, 6]}

- id: region/frost_fjord               # 푸른 안개 + 눈송이
  music: "harbor:music.fjord"
  ambient: "harbor:ambient.fjord"
  post_effect: "harbor:fjord_mist"
  particles:
    - {type: snowflake, count: 6, radius: 14, height: [0, 10]}
  phases:
    - id: dawn_mist
      time: [22300, 1500]
      fade: 800
      particles:
        - {type: cloud, count: 4, radius: 14, height: [-1, 1], water: true}

- id: region/ash_trench                # 짧은 물속 시야 + 어두운 조명
  music: "harbor:music.trench"
  ambient: "harbor:ambient.trench"
  post_effect: "harbor:trench_dark"
  particles:
    - {type: underwater, count: 8, radius: 10, height: [-6, 4]}

- id: region/void_sea
  music: "harbor:music.void_sea"
  ambient: "harbor:ambient.void_sea"
  post_effect: "harbor:void_shimmer"
  particles:
    - {type: reverse_portal, count: 4, radius: 14, height: [0, 8]}
