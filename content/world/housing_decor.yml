# 하우징 장식 상점 (docs 20 8.4 '장식 상점', '12. 월드 · 하우징 · 통발' 4장, 추가 제안 형식). 시즌이 바뀌어도 남는 후반 골드 소모처.
# 산 장식은 인벤토리가 아니라 housing_decor_owned에 개수로 쌓이고, 플롯 안 팔레트(/부두 장식)에서 꺼내 설치한다.
#   kind       block (블록 하나: material 바닐라 블록 또는 block: block/<id> 커스텀 블록)
#              · furniture (furniture: furniture/<id> = furniture/furniture.yml 가구. 예전 방식 model만 적어도 됨)
#              · tank (개인 어항 수조 = Collection 전시 칸 자리)
#   size       tank 크기 [가로, 높이, 깊이] (기본 [1, 1, 1], 각 1~8). 놓은 블록이 앞·왼쪽·아래 모서리이고
#              놓는 사람의 오른쪽으로 가로, 바라보는 쪽으로 깊이, 위로 높이만큼 채운다 (추가 제안)
#   fish       tank 하나에 전시할 물고기 수 (기본 1, 칸 수 이하). 마리마다 전시 칸 하나를 쓴다 (추가 제안)
#   tank_model 설치한 tank 위에 씌우는 모델 (틀·물·장식, 물고기 없음). 수조 크기에 맞춰 늘리고 놓은 쪽을 앞으로 돌린다.
#              없으면 material 블록만 보인다. model은 상점·손에 든 아이콘 (추가 제안)
#              tank_model이 유리까지 그리므로 material은 minecraft:barrier(보이지 않는 충돌 블록)로 둔다:
#              여러 칸 수조에 유리 블록 이음새가 생기지 않는다. 왼클릭 한 번에 회수된다. 모델이 없으면 유리 하나를 늘려 보여 준다
#   amount     한 번 살 때 받는 개수 (기본 1)
#   price      골드 (원장 HOUSING_DECOR)
#   reputation_min  시즌 간 최고 평판 등급 조건 (players.best_rep_tier, D11)

