# 보스 모델 리그 ('8. 시스템 상세 기획' 9장: 여러 ItemDisplay 부위 + 보간 애니메이션, 부위 30개 이하,
# 피격 판정은 부위별 Interaction, 약점이 드러나면 해당 부위만 발광). 형식은 추가 제안.
# hitbox가 있는 뼈마다 판정 상자를 만든다 (spawn 옵션 withHitboxes를 줬을 때만). 클릭은 RigHit(뼈 이름)로 넘어간다.
# 예시: 늪지의 주인 '그놈' (입문 보스). 모델 키·수치는 예시이고 Boss 모듈 작업 때 맞춘다.

- id: rig/boss/gnome
  length: 3.2
  scale: 1.0
  forward: -z
  view_range: 2.0
  default_animation: idle
  bones:
    - name: body
      pivot: [0, 0.6, 0]
      part: {item_model: "harbor:rig/boss/gnome/body", scale: 2.0}
      hitbox: {width: 1.6, height: 1.2}
    - name: head
      parent: body
      pivot: [0, 0.2, -1.1]
      part: {item_model: "harbor:rig/boss/gnome/head", scale: 1.6, glow_color: "#FF5555"}
      hitbox: {width: 1.0, height: 0.9, offset: [0, 0, -0.2]}
    - name: jaw
      parent: head
      pivot: [0, -0.25, -0.2]
      part: {item_model: "harbor:rig/boss/gnome/jaw", scale: 1.6}
    - name: tail_1
      parent: body
      pivot: [0, 0, 1.0]
      part: {item_model: "harbor:rig/boss/gnome/tail_1", scale: 1.6}
    - name: tail_2
      parent: tail_1
      pivot: [0, 0, 0.8]
      part: {item_model: "harbor:rig/boss/gnome/tail_2", scale: 1.3}
      hitbox: {width: 0.8, height: 0.6}
    - name: whisker_l
      parent: head
      pivot: [0.35, -0.1, -0.4]
      part: {item_model: "harbor:rig/boss/gnome/whisker", scale: 1.2}
    - name: whisker_r
      parent: head
      pivot: [-0.35, -0.1, -0.4]
      part: {item_model: "harbor:rig/boss/gnome/whisker", scale: [-1.2, 1.2, 1.2]}
    - name: mud
      parent: body
      pivot: [0, -0.7, 0]
      part: {block: "minecraft:mud", offset: [-0.5, 0, -0.5], scale: [1.0, 0.1, 1.0]}
  animations:
    idle:
      length: 40
      bones:
        body:
          position:
            - {t: 0, v: [0, 0, 0], ease: ease_in_out}
            - {t: 20, v: [0, 0.12, 0], ease: ease_in_out}
            - {t: 40, v: [0, 0, 0]}
        tail_1:
          rotation:
            - {t: 0, v: [0, -10, 0], ease: catmullrom}
            - {t: 20, v: [0, 10, 0], ease: catmullrom}
            - {t: 40, v: [0, -10, 0]}
        tail_2:
          rotation:
            - {t: 0, v: [0, -18, 0], ease: catmullrom}
            - {t: 20, v: [0, 18, 0], ease: catmullrom}
            - {t: 40, v: [0, -18, 0]}
        whisker_l:
          rotation:
            - {t: 0, v: [0, 15, 0], ease: ease_in_out}
            - {t: 20, v: [0, 30, 0], ease: ease_in_out}
            - {t: 40, v: [0, 15, 0]}
        whisker_r:
          rotation:
            - {t: 0, v: [0, -15, 0], ease: ease_in_out}
            - {t: 20, v: [0, -30, 0], ease: ease_in_out}
            - {t: 40, v: [0, -15, 0]}
    mud_spit:              # 진흙 뿌리기 예고 (한 번 재생 후 idle)
      length: 24
      mode: once
      bones:
        head:
          rotation:
            - {t: 0, v: [0, 0, 0], ease: ease_out}
            - {t: 10, v: [-25, 0, 0], ease: ease_in}
            - {t: 14, v: [15, 0, 0], ease: ease_out}
            - {t: 24, v: [0, 0, 0]}
        jaw:
          rotation:
            - {t: 0, v: [0, 0, 0]}
            - {t: 12, v: [0, 0, 0], ease: ease_out}
            - {t: 16, v: [35, 0, 0], ease: ease_in}
            - {t: 24, v: [0, 0, 0]}
    dive:                  # 늪 바닥 잠수 (마지막 자세 유지, 다시 떠오를 때 idle 재생)
      length: 30
      mode: hold
      bones:
        body:
          position:
            - {t: 0, v: [0, 0, 0], ease: ease_in}
            - {t: 30, v: [0, -2.5, 0]}
          rotation:
            - {t: 0, v: [0, 0, 0]}
            - {t: 15, v: [30, 0, 0], ease: ease_in_out}
            - {t: 30, v: [10, 0, 0]}
