# 리소스팩 어종 리그(harbor_rig_v1)에서 harbor-tools rig-import로 만든 파일. 직접 고치지 말고 다시 변환한다 (./gradlew rigImport -Prigs=<리그 폴더>).
# 동작은 원본 베이크 프레임(20tps)을 고른 틱 간격(step) 샘플로 옮긴 것이다. 회전은 기본 자세 오일러 각(X → Y → Z)에 더하는 값(도), 위치는 pivot에 더하는 값(블록).
- id: rig/fish/shell_clamfish
  forward: -z
  length: 0.672
  default_animation: swim
  bones:
    - {name: root, pivot: [0, 0.25, 0], part: {item_model: "harbor:fish/shell_clamfish/root"}}
    - {name: lid, parent: root, pivot: [0, 0.0313, 0.3125], part: {item_model: "harbor:fish/shell_clamfish/lid"}}
    - {name: head, parent: root, part: {item_model: "harbor:fish/shell_clamfish/head"}}
    - {name: tail, parent: head, pivot: [0, 0, 0.2344], part: {item_model: "harbor:fish/shell_clamfish/tail"}}
  animations:
    swim:
      length: 32
      mode: loop
      bones:
        root:
          position: {step: 2, v: [0, 0, 0, 0, 0.022, -0.031, 0, 0.053, -0.05, 0, 0.069, -0.031, 0, 0.075, 0, 0, 0.069, 0.031, 0, 0.053, 0.05, 0, 0.022, 0.031, 0, 0, 0, 0, 0.022, -0.031, 0, 0.053, -0.05, 0, 0.069, -0.031, 0, 0.075, 0, 0, 0.069, 0.031, 0, 0.053, 0.05, 0, 0.022, 0.031, 0, 0, 0]}
        lid:
          rotation: {step: 2, v: [-12.5, 0, 0, -20.3, 0, 0, -25, 0, 0, -20.3, 0, 0, -12.5, 0, 0, -4.7, 0, 0, 0, 0, 0, -4.7, 0, 0, -12.5, 0, 0, -20.3, 0, 0, -25, 0, 0, -20.3, 0, 0, -12.5, 0, 0, -4.7, 0, 0, 0, 0, 0, -4.7, 0, 0, -12.5, 0, 0]}
        tail:
          rotation: {step: 2, v: [0, 0, 0, 0, 12.5, 0, 0, 20, 0, 0, 12.5, 0, 0, 0, 0, 0, -12.5, 0, 0, -20, 0, 0, -12.5, 0, 0, 0, 0, 0, 12.5, 0, 0, 20, 0, 0, 12.5, 0, 0, 0, 0, 0, -12.5, 0, 0, -20, 0, 0, -12.5, 0, 0, 0, 0]}
