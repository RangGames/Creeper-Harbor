# 어종 공용 리그 ('16. 플러그인 설계' 5.10). 형식은 추가 제안 (rigs/*.yml).
# 어종별 리그(rig/fish/<모델 이름>)는 리소스팩 리그 JSON(harbor_rig_v1)에서 harbor-tools rig-import로 만든 rigs/fish/<이름>.yml에 있다
# (./gradlew rigImport -Prigs=<리소스팩 assets/harbor/rigs/fish 폴더>, 직접 고치지 말고 다시 변환).
# 어종 → 리그는 fish/*.yml의 model(harbor:fish/<이름>) → rig/fish/<이름> (Common FishRigs).
# 단위: 블록 · 도 · 틱. 회전은 [x, y, z] 오일러 각이고 X → Y → Z 순서로 돈다. 머리가 −Z인 모델은 forward: -z.
# item 부품은 item_display의 Y축 180° 뒤집힘을 Core가 오른쪽 회전으로 되돌린다 (flip 기본 true).

# 낚시 대기 중 그림자 (Fishing 3.1: 등급에 맞는 그림자를 캐스터에게만). 부품 하나짜리 단순 리그
- id: rig/fish/shadow_small
  forward: -z
  default_animation: swim
  bones:
    - name: body
      part: {item_model: "harbor:rig/shadow/small", rotation: [90, 0, 0], brightness: [0, 0]}
  animations:
    swim:
      length: 20
      bones:
        body:
          rotation:
            - {t: 0, v: [0, 8, 0], ease: ease_in_out}
            - {t: 10, v: [0, -8, 0], ease: ease_in_out}
            - {t: 20, v: [0, 8, 0]}
    bite:
      length: 8
      mode: hold
      bones:
        body:
          position:
            - {t: 0, v: [0, 0, 0], ease: ease_in}
            - {t: 8, v: [0, -0.4, 0]}
    leap:                  # 점프 (Fishing 파이팅 점프 패턴: 한 번 재생 후 swim). 그림자가 수면 위로 튀어 올랐다 떨어진다
      length: 16
      mode: once
      bones:
        body:
          position:
            - {t: 0, v: [0, 0, 0], ease: ease_out}
            - {t: 8, v: [0, 1.6, 0], ease: ease_in}
            - {t: 16, v: [0, 0, 0]}
          rotation:
            - {t: 0, v: [-35, 0, 0]}
            - {t: 8, v: [0, 0, 0]}
            - {t: 16, v: [40, 0, 0]}
