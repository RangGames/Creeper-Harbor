# Harbor-Economy 상점·제작 아이템 ('3. 아이템 목록', '13. 제작 · 상점 가격' 2·3장). 레시피는 recipes.yml.
# 부품(낚싯줄·찌·릴)의 stats는 Fishing이 읽는 키를 따른다. 문서에 수치가 없는 값은 제안값.
# 부품은 /낚싯대로 낚싯대에 달아야 효과가 난다 (fishing/rod.yml). 조건부 키 (추가 제안):
#   <스탯>.<조건>: 조건이 맞을 때만 더함 (bite_wait.night = 밤에만 입질 대기)
#   weight_bonus.<조건>[+<조건>]: 조건이 모두 맞는 어종의 출현 가중치 + 값. 조건은 어종 tags(fresh·sea·carnivore 등),
#     시간대(dawn·day·dusk·night), 지역 이름(frost_fjord 등). 지역 전체에 맞으면 희귀 이상 가중치 보정(미끼 범주)이 된다
#   bite_proof: 1 → 이빨 있는 어종(tags: toothy)에게 줄 강도 벌칙을 받지 않음

- id: item/rod/coral_carbon
  name: 산호 카본 낚싯대
  lore: "산호 조각을 겹겹이 붙여 만든 가볍고 질긴 낚싯대."
  type: rod
  grade: rare
  base_item: minecraft:fishing_rod
  model: harbor:rod/coral_carbon
  stats:
    bite_wait: -0.15        # 제안값
    line_strength: 2        # 제안값
  tradeable: true
  season_reset: true

- id: item/line/cotton
  name: 무명 낚싯줄
  lore: "평범한 무명실. 큰 고기가 걸리면 조마조마하다."
  type: line
  grade: common
  base_item: minecraft:string
  model: harbor:line/cotton
  stats: {line_strength: 1}   # 제안값
  buy_price: 200
  tradeable: true
  season_reset: true

- id: item/line/steel_wire
  name: 강철 와이어 줄
  lore: "철사를 꼬아 만든 줄. 이빨 날카로운 물고기도 끊지 못한다."
  type: line
  grade: uncommon
  base_item: minecraft:string
  model: harbor:line/steel_wire
  stats: {line_strength: 3, bite_proof: 1}   # line_strength 제안값, bite_proof = 이빨 있는 어종 줄 끊김 방지
  tradeable: true
  season_reset: true

- id: item/float/feather
  name: 깃털 찌
  lore: "갈매기 깃털로 만든 찌. 작은 입질도 놓치지 않는다."
