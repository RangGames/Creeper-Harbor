# Harbor-Economy 상점·제작 아이템 ('3. 아이템 목록', '13. 제작 · 상점 가격' 2·3장). 레시피는 recipes.yml.
# 부품(낚싯줄·찌·릴)의 stats는 Fishing이 읽는 키를 따른다. 문서에 수치가 없는 값은 제안값.

- id: item/rod/coral_carbon
  name: 산호 카본 낚싯대
  lore: "산호 조각을 겹겹이 붙여 만든 가볍고 질긴 낚싯대."
  type: rod
  grade: rare
  base_item: minecraft:fishing_rod
  model: harbor:rod/coral_carbon
  stats:
    rare_weight: 0.05       # 희귀 이상 +5% ('3. 아이템 목록' 1장)
    cast_distance: 0.2      # 캐스팅 거리 +20%
  tradeable: true
  season_reset: true

- id: item/rod/deep_pressure
  name: 심해 수압 낚싯대
  lore: "해구의 수압을 버티도록 만든 묵직한 낚싯대. 줄이 바닥까지 닿는다."
  type: rod
  grade: epic
  base_item: minecraft:fishing_rod
  model: harbor:rod/deep_pressure
  stats:
    line_strength: 3        # 줄 강도 +3 ('3. 아이템 목록' 1장)
    rare_weight: 0.10       # 기획 '심해 어종 가중치 +10%'(제안값)를 희귀 이상 가중치로 대신한다 (지역별 가중치 스탯이 없음)
  tradeable: true
  season_reset: true

