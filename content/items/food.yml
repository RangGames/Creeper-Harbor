# 요리 ('3. 아이템 목록' 8장). 버프는 fishing/food.yml (Harbor-Fishing, 출처 food:, 1종만 적용). 레시피는 Economy (요리 화로).
# components: 먹는 시간·애니메이션(consumable), 허기·포화(food), 그릇 반환(use_remainder) ('8. 시스템 상세 기획' 2장).
# 허기·포화는 기본 아이템 값을 따랐고, 버프 요리라 배가 불러도 먹을 수 있게 했다 (can_always_eat, 제안값).

- id: item/food/grilled_fish
  name: 생선구이
  lore: "소금 한 꼬집이면 충분하다."
  type: food
  grade: common
  base_item: minecraft:cooked_cod
  model: harbor:food/grilled_fish
  tradeable: true
  season_reset: true
  components:
    consumable: {seconds: 1.6, animation: eat}
    food: {nutrition: 5, saturation: 6.0, can_always_eat: true}

