# '7. 밸런스 기획'의 수치. 서버 재시작 없이 /harbor reload balance로 다시 읽는다.

fishing:
  grade_weight:          # 4.1 등급 가중치 (지역에 없는 등급은 빼고 다시 100%로 맞춤)
    common: 60
    uncommon: 25
    rare: 10
    epic: 4
  rare_bonus_cap: 0.60   # 4.2 희귀 이상 보정 합계 상한
  legend:                # 4.3 전설 판정
    base_chance: 0.004
    pity_start: 150
    pity_step: 0.0002
    max_chance: 0.025
  mythic:
    event_chance: 0.01   # 4.4
  bite_wait_s: {min: 15, max: 35}   # 제안값 (시간당 약 80마리 목표로 CBT에서 조정)
  no_bait_wait: 1.2
  line_strength_step: 0.08          # 줄 강도 1당 텐션 한계 +8% (5장)
  ping_comp_s: 0.2                  # 핑 150ms 이상이면 패턴 예고 +0.2초
  grade_exp: {common: 5, uncommon: 12, rare: 40, epic: 150, legendary: 800, mythic: 2000}   # 3.3
  first_catch_mult: {default: 5, legendary: 3}
  region_exp_mult: {harbor: 1.0, swamp: 1.1, coral_isles: 1.3, lava_lake: 1.6, frost_fjord: 1.7, ash_trench: 1.9, void_sea: 2.2}
  minigame:                         # 5장. 텐션 상승·틱당 감기는 제안값
    release_rate: 0.03
    reel_per_tick: 1.6
    safe_low: 0.25
    safe_width: 0.45
    escape_ticks: 40
    common: {hp: 100, tension_rise: 0.012, patterns: 0}
    uncommon: {hp: 180, tension_rise: 0.018, patterns: 1, pattern_interval_s: 4}
    rare: {hp: 350, tension_rise: 0.022, patterns: 2, pattern_interval_s: 3}
    epic: {hp: 600, tension_rise: 0.030, patterns: 3, pattern_interval_s: 2.5}
    legendary: {hp: 1200, tension_rise: 0.035, patterns: 4, pattern_interval_s: 2}
    warn_tension: 0.85              # 이 이상이면 화면 가장자리 경고 (WorldBorderService)
  quality:               # 4.5 품질 경계 (백분위)
    star2: 0.40
    star3: 0.70
    star4: 0.90
    star5: 0.98
    tier_cap: [3, 4, 5]  # 직업 단계별 품질 상한
  bite_window_ticks: 20             # 입질 창 (제안값, + 핑 보정)
  long_cast: {distance: 20}         # 원투 기준 거리 (이상이면 tension_safe_zone_long_cast 적용)
  trap:                             # 8장 통발 (D1: 계정 전체 하루 상한)
    cycle_h: 8
    min_cycle_h: 2                  # 통발 회전으로 줄어도 이보다 짧지 않음 (제안값)
    max_cycles: 2
    bait_per_slot: 1
    bait_capacity: 64               # 통발 하나에 넣어 둘 수 있는 미끼 (제안값)
    base_count: 2                   # 설치 개수 기본 (생산 2차·3차 trap_count +1, 최대 4)
    max_count: 4
    revenue_cap: {base: 0.4, produce_2: 0.5, produce_3: 0.6}
    revenue_window_h: 24
    # 수동 낚시 시간당 골드 (3.2 표). 상한 = 주인 통발 지역 중 가장 높은 값 × revenue_cap (World 해금 정보 대신 근사, 제안)
    hourly_gold: {harbor: 600, swamp: 1000, coral_isles: 1800, lava_lake: 2800, frost_fjord: 3200, ash_trench: 3800, void_sea: 4500}
    slot_price: 2000                # 6.3 슬롯당 2,000 × 통발 단계
    max_extra_slots: 3              # 통발 하나에 살 수 있는 확장 슬롯 (제안값)
    retrieve_days: 7
    buoy_radius: 2.5                # 부표 자리 인정 거리 (블록, 제안값)
    refund_bait_item: harbor:item/bait/earthworm   # 철거·회수 때 남은 미끼를 돌려주는 아이템 (제안값)
  food:
    feast_radius: 16                # 연회 요리 공유 거리 (블록, 제안값)

economy:
  market:                # 6.2 시세 계수 M = clamp(1 − 0.35 × (S/S₀ − 1), 0.5, 1.2)
    slope: 0.35
    min: 0.5
    max: 1.2
    window_h: 24
    s0_floor: 20           # 제안값
    stale_h: 3             # 이 시간 넘게 갱신이 없으면 관리자 알림
    catches_per_hour: 80
    sell_ratio: 0.85
  quality_mult: {1: 1.0, 2: 1.2, 3: 1.5, 4: 2.5, 5: 5.0}   # D2 확정값 (docs 20 0.6, 7.4)
  region_factor: {void_sea: 0.65}
  legend_cap: 3000
  repair: {rate: 0.03, broken_rate: 0.10}
  bulk: {threshold: 32}                 # 일괄 판매 미끄러짐 기준 마릿수 (제안값, docs 20 7.4)
  big_deal: {max: 64, coef: 1.0}        # 큰손 거래 (경제 계열 캡스톤, 주 1회)
  auction:              # '7. 밸런스 기획' 6.3·6.5
    list_fee: 0.01      # 등록비 1% (환불 없음, 경매 감각 −0.5%/랭크)
    sale_fee: 0.05      # 판매 수수료 5% (경제 계열 2차 4%, 3차 3% — jobs.yml auction_fee)
    min_ratio: 0.5
    max_ratio: 10
    duration_h: 48
    slots: {1: 5, 2: 5, 3: 10, 4: 10, 5: 15}   # 항구 평판 등급별 5 / 10 / 15 (등급 대응은 제안값), 경매 좌판 +2/랭크
    new_account_h: 5
    mythic_ref: 6000    # D12 신화 어종 기준가 → 등록가 3,000~60,000G
    board_radius: 8     # 등록·취소 가능 반경 (docs 20 7.5)
    cache_s: 30
  craft: {station_radius: 6, max_save: 0.5}   # 제안값
  fraud:                # 부정 거래 감시 (docs 20 7.4, 모두 제안값)
    linked_score: 60    # 같은 IP(공유 IP 제외)로 연결된 계정 사이
    pair_window_d: 7
    pair_count: 3       # 같은 두 사람 사이 7일에 3회 이상 (이번 거래 포함)
    pair_score: 40
    outlier_ratio: 5    # 기준가의 5배 이상 낙찰
    outlier_score: 30
    wash_ratio: 0.6     # 연결 계정끼리 기준가 0.6배 이하 (헐값 넘기기)
    wash_score: 20
    trap_alt_score: 30  # 연결 계정끼리 통발 어종 거래
    flag_score: 30      # 이 점수 이상이면 trade_flag 기록 + 관리자 알림
    hold_score: 70      # 이 점수 이상이면 판매 대금 보류 (우편함 HELD)
    hold_h: 24
    auto_release: true  # 보류 시간이 지나면 자동 해제 (false면 관리자 해제, docs 20 7.8 열린 질문)
    index_min: 0.8      # 경매 희귀 시세 지수 경고 범위 ('7. 밸런스 기획' 11장)
    index_max: 2.0

# 보정자 스탯: 기본값·하한·상한 (/harbor stat에서 확인)
stats:
  rare_weight:
    base: 0
    max: 0.60
  bite_wait:
    base: 1.0
    min: 0.2
  sell_price:
    base: 1.0
    min: 0
  reel_speed:
    base: 1.0
    min: 0.1
  line_strength:
    base: 0
    min: 0
  exp_gain:
    base: 1.0
    min: 0
  tension_safe_zone:
    base: 1.0
    min: 0.2
  size_luck:
    base: 0
  bait_save_chance:
    base: 0
    max: 1
  pattern_warn:
    base: 0
  first_catch_exp_bonus:
    base: 0
  uncaught_weight:
    base: 0
  epic_weight:
    base: 0
  legend_pity_start:
    base: 0
  legend_chance:
    base: 1.0
  cast_distance:
    base: 1.0
  shop_buy_price:
    base: 1.0
    min: 0.5
  repair_cost:
    base: 1.0
    min: 0
  market_info:
    base: 0
  # Harbor-World (docs 20 8.4, 제안값). 탐험 계열 패시브·스킬은 ADD로 더한다
  boat_speed:              # 선박 속도 배율 (자동 패시브 +10% · 순풍 +5%/랭크)
    base: 1.0
    min: 0.2
  boat_damage:             # 폭풍 선체 피해 배율 (자동 패시브 −10% · 튼튼한 선체 −8%/랭크)
    base: 1.0
    min: 0
  debuff_damage:           # 환경 피해 배율 (환경 적응 −15%/랭크)
    base: 1.0
    min: 0
  debuff_duration:         # 혹한·산소 게이지 변화 배율 (탐험 3차 −20%)
    base: 1.0
    min: 0.1
  env_rate:                # 환경 게이지 상승 배율 (추가 제안)
    base: 1.0
    min: 0
  cold_debuff_time:        # 혹한 게이지 상승 배율 (협만 생선 수프 −50%)
    base: 1.0
    min: 0.1
  chart_reward_gold:       # 해도 보상 골드 추가 (해도 장인 +25%/랭크)
    base: 0
  event_forewarn_s:        # 해상 이벤트 예고를 먼저 받는 초 (물때 읽기 30)
    base: 0
  feature_storm_sailing:   # 폭풍 항해 랭크 (1: 속도 감소 없음, 2: 낙뢰 피해 −50%)
    base: 0
  feature_hidden_spot:     # 숨은 낚시터 감지
    base: 0
  feature_school_radar:    # 바다 읽기 (물고기 떼 64블록)
    base: 0

# 개발 서버의 월드 이름을 지역 월드(harbor_main 등)에 대응시킨다 (운영 서버는 비움)
world_alias:
  world: harbor_main

items:
  # 커스텀 모델(item_model) 사용. lobby가 리소스팩을 보내고 있을 때만 true (팩 없이 켜면 보라·검정 상자로 깨진다).
  # true여도 resource_pack.yml(팩의 모델 목록)에 있는 모델만 쓰고, 나머지는 base_item 모양·리그 숨김. 키가 없으면 false (추가 제안)
  custom_models: true
  fish_base_item: minecraft:cod
  # tooltip_style:       # 등급별 툴팁 테두리 (리소스팩 준비 후)
  #   legendary: harbor:legendary

# 직업 ('7. 밸런스 기획' 3장, docs 20 2.3)
jobs:
  exp_formula: {coef: 2, exp: 2.05, round: 10}   # Lv L → L+1 필요 EXP = 2 × L^2.05
  max_level: 70
  tier_level_cap: {1: 30, 2: 60, 3: 70}
  quality_cap: {1: 3, 2: 4, 3: 5}
  advance_cost: {2: 15000, 3: 90000}
  line_change_cost: {2: 30000, 3: 80000}
  refund_ratio: 0.8
  common_reset_cost: 5000
  region_decay: {gap: 15, mult: 0.5}
  catchup:
    week5: {week: 5, gap: 10, bonus: 0.5}
    week9: {week: 9, gap: 10, bonus: 1.0}
  tier_first_quality_bonus: 2   # 제안값
  tier_points: {2: 8, 3: 30}
  capstone_requires: 60
  other_line_limit: 40
  curve_check: {10: 620, 20: 5640, 30: 19940, 40: 48560, 50: 96650, 60: 169410, 70: 272120}

# 디스플레이 리그 재생 ('16. 플러그인 설계' 5.10, 시제품 값은 '17-3' 9.4)
rig:
  fps: 10                  # 리그 동작을 10fps로 샘플링 (시제품). 20의 약수
  compress:                # 부품별 키프레임 압축 허용 오차 (시제품: 이동 0.005블록, 회전 1.2°, 최대 간격 8프레임)
    position: 0.005
    rotation: 1.2
    scale: 0.005           # 제안값
    max_gap: 8
  max_parts: 30            # 리그 하나의 부품·판정 상자 상한 ('8. 시스템 상세 기획' 12장 보스 부위 30개 이하)
  move_ticks: 2            # 이동·방향 보간 기본값 (teleport_duration, '17-3' 9.4 16블록 이하 2틱)
  blend_ticks: 4           # 동작 전환 이어 붙이기 (제안값)
  lod_distance: 48         # 가장 가까운 시청자가 이보다 멀면 애니메이션 갱신 생략 (제안값)
  tick_budget_ms: 1.0      # 틱당 리그 갱신 예산 (제안값, '17-3' 9.6 메인 스레드 1.0ms 기준)
  hitbox_interval: 2       # 부위 판정 상자 위치 갱신 주기 (틱, 제안값)
  part_budget: 300         # 플레이어 1명 주변 표시 부품 기준 ('16. 플러그인 설계' 7장)

# 항구 평판 (docs 20 5.3·5.4, 모두 제안값 — CBT 지표로 확정)
reputation:
  tiers:
    1: {points: 0, name: 이방인}
    2: {points: 300, name: 이웃}
    3: {points: 1000, name: 단골}
    4: {points: 2000, name: 항구의 일원}
    5: {points: 3500, name: 항구의 기둥}
  sources:                 # 출처별 기본값 (Quest 보상 표에 값이 없을 때)
    main_story: 150
    region_quest: 40
    daily_request: 10      # 하루 1회는 의뢰 규칙(Quest)
    weekly_request: 30     # 주 3회는 의뢰 규칙(Quest)
    collect_request: 20    # CONTRIBUTION (reputation_gain 보정자 적용)
    boss_first_kill: 50    # 보스당 시즌 1회 (refId boss1:<보스>)
    world_boss: 500
    release: 3             # CONTRIBUTION, 희귀 이상 방류
  daily_caps:
    release: 30
  recent_size: 10          # /평판 최근 내역 줄 수

# NPC (docs 20 5.4, 추가 제안. 수치는 모두 제안값)
npc:
  affinity:
    levels:                # 단계별 필요 호감도·상점 할인 % (npcs.yml affinity_levels가 없을 때)
      0: {points: 0, name: 낯섦}
      1: {points: 100, name: 아는 사이}
      2: {points: 300, name: 친구, discount: 3}
      3: {points: 600, name: 단짝, discount: 5}
      4: {points: 1000, name: 신뢰, discount: 8}
    greet: 2               # 하루 첫 대화
    gift_default: 1        # gifts 표에 없는 아이템
    gift_quality_bonus: 0.25   # 어종 선물 × (1 + 0.25 × (★ − 1))
    gifts_per_day: 1       # NPC당
    reactions: {love: 15, like: 5}
  dialog:
    timeout_seconds: 300
    option_distance: 6
    click_cooldown_ticks: 10
  entity:
    look_interval_ticks: 4
    interaction_width: 0.8
    interaction_height: 2.0
    name_offset: 2.15
    marker_offset: 2.5
  wanderer:
    slot_hours: 3          # Asia/Seoul 0·3·6…시
    check_interval_ticks: 1200   # 조건부 후보 확인 (1분)
    max_delay_seconds: 60  # 대화 중이면 이동을 미루는 최대 시간
  cutscene:
    restore_timeout_ms: 1000
    skip_window_ticks: 10
    max_entities: 20
    camera_step_ticks: 40

# Harbor-Season (docs 20 11.4·11.6). 모두 제안값
season:
  clock:
    check_s: 60          # 주차 변경·초기화 시각 확인 주기 (docs 20 11.4: 1분)
    meta_reload_s: 300   # season_meta(주차 보정·상태) 다시 읽기
  ranking:
    check_s: 60          # 집계 서버 선출 주기. 보드별 집계 주기는 season/rankings.yml refresh
    lock_ttl_s: 50       # harbor:lock:ranking 유지 시간 (check_s보다 짧게)
  hall_of_fame:
    announce: true
    announce_throttle_s: 30
  gate:
    notice: true         # 새 시즌 첫 접속 안내 Dialog

# Harbor-Quest (docs 20 6.4·6.6). 모두 제안값. 의뢰 보상은 board.yml, 연대기 회상은 chronicle.yml, 클라이맥스는 progress.yml
quest:
  active_limit: 20                 # 진행 중 퀘스트 상한 (의뢰 제외)
  abandon_cooldown_minutes: 10     # 포기 후 같은 cycle 재수락 대기
  tracker:
    waypoint_actionbar: true       # 추적 목표 방향·거리 액션바 (위치 표시 막대 waypoint는 Phase 1 검증 뒤)

# Harbor-Boss (docs 20 10.4, '7. 밸런스 기획' 9장). 유형 표는 문서 값, 나머지는 제안값
boss:
  types:
    # per_player_rate: 인원당 체력 증가, time_limit: 초, weekly: 주간 보상 횟수, gold: 클리어 골드(제안값),
    # telegraph_ticks: 예고 시간(제안값), pattern_gap_ticks: 패턴 간격(제안값), anchors_min: 시작에 필요한 앵커 수
    intro:     {per_player_rate: 0.60, time_limit: 360,  weekly: 5, gold: 300,  telegraph_ticks: 30, pattern_gap_ticks: 100, anchors_min: 1, tension_mult: 0.8}
    sea:       {per_player_rate: 0.50, time_limit: 480,  weekly: 3, gold: 800,  telegraph_ticks: 24, pattern_gap_ticks: 80,  anchors_min: 1, tension_mult: 1.0}
    dimension: {per_player_rate: 0.45, time_limit: 720,  weekly: 2, gold: 1500, telegraph_ticks: 20, pattern_gap_ticks: 70,  anchors_min: 1, tension_mult: 1.1}
    raid:      {per_player_rate: 0.40, time_limit: 1200, weekly: 1, gold: 3000, telegraph_ticks: 18, pattern_gap_ticks: 60,  anchors_min: 2, tension_mult: 1.2}
    world:     {per_player_rate: 0,    time_limit: 1800, weekly: 1, gold: 2000, telegraph_ticks: 30, pattern_gap_ticks: 60,  anchors_min: 0, tension_mult: 1.0}
  latency: {ping_ms: 150, extra_ticks: 4}       # 핑 150ms 이상 파티원이 있으면 예고 +0.2초 ('7. 밸런스 기획' 5장)
  prepare_seconds: 30                           # 파티 대기 (역할 선택)
  intro_seconds: 5                              # 등장 연출
  hook:
    seconds: 20                                 # 걸기 게이지 0 → 100% (안전 구간 유지)
    line_break_cap: 0.5                         # 줄 끊김 → 게이지 50%로
    decay_per_second: 0.05                      # 앵커 후보가 없으면 초당 5%
    reopen_ticks: 40
    anchor_grace_seconds: 5                     # 앵커 교대 유예 (텐션 고정)
  anchor:
    safe_min: 0.2                               # 텐션 안전 구간
    safe_max: 0.85
    reel_damage_per_second: 0.003               # 안전 구간 유지 중 초당 최대 체력의 0.3%
  counter:
    weak_interval_seconds: 12                   # 약점 노출 주기
    weak_seconds: 4
    safe_speedup: 1.5                           # 앵커 안전 구간 유지 시 약점 노출 간격 단축
  damage:
    weak: 3.0                                   # 부위 배율 (약점 노출 3.0, 일반 1.0, armor 0.2)
    normal: 1.0
    armor: 0.2
    stab: 0.5                                   # 작살 근접 찌르기 배율 (추가 제안)
    stab_cooldown_ticks: 10
    harpoon_base: 20                            # 아이템 stats에 harpoon_damage가 없을 때
    harpoon_track_ticks: 60
  qte:
    rounds: 3
    inputs: 4
    window_seconds: 1.0
    pass: 0.6
    win: 2
    lose: 2
    recover: 0.2                                # 실패 2회 → 체력 20% 회복 후 반격 (1회까지)
    gap_ticks: 30
  contribution:
    damage: 0.3                                 # 가중치
    tension: 0.3
    repair: 0.2
    evasion: 0.2
    top_ratio: 0.2                              # 상위 20%(올림)에 재료 1개 추가
    min_score_ratio: 0.05                       # 점수 최고점의 5% 미만이고
    min_active_ratio: 0.3                       # 활동 시간이 전투 시간의 30% 미만이면 보상 없음
    active_window_seconds: 5
    supply_seconds: 60                          # 보급관 버프 요리 1회 = 근처 파티원 × 60
  loot:
    over_limit_gold_ratio: 0.2                  # 주간 횟수 초과 클리어 = 클리어 골드의 20%
    quartermaster_bonus: 0.1                    # 보급관 전리품 보너스 (드롭 확률 +, 추가 제안)
    capture_luck: 0.3                           # 보스 어종 품질 보너스 (행운 +0.3)
    capture_quality_stars: 1
  leave:
    slot_hold_seconds: 60                       # 퇴장 뒤 슬롯 유지
    all_absent_fail_seconds: 60                 # 전원 이탈 60초 → 실패
    fall_seconds: 5                             # 낙수 뒤 갑판 복귀
  limits: {field: 6, instance: 4}               # 동시 조우 상한
  party: {invite_seconds: 60}
  items:
    repair_kit: item/boat/repair_kit            # 정비사 수리 키트 (World 아이템)
  world:
    min_participants: 10                        # 유효 참여 최소 인원 (확정, D13)
    active_seconds: 60                          # 유효 참여 = 최근 60초 기여
    rescale_seconds: 10
    broadcast_seconds: 2                        # harbor:worldboss 방송
    save_seconds: 10                            # harbor:worldboss:state·DB 저장
    resume_minutes: 10
    radius: 64
    max_anchors: 20
    climax_boss: boss/green_thunder_fish        # Quest 서버 플래그 climax_start로 시작할 월드 보스
  instance:
    slots: 4                                    # 경기장 칸 수
    spacing: 1000                               # 칸 간격 (블록, X축)
    reply_seconds: 10                           # 배정 응답 대기 → "자리 없음"
    confirm_seconds: 15
    arrive_seconds: 60                          # 파티원 도착 대기
    rejoin_ttl_seconds: 120                     # harbor:boss:rejoin 만료

# Harbor-World (docs 20 8.4 · '12. 월드 · 하우징 · 통발'). 문서에 없는 값은 모두 제안값
world:
  region:
    safe_distance: 3          # 경계에서 이만큼 떨어져 있을 때 안전 위치 저장 (블록)
    push_speed: 0.6           # 밀어내기 속도
    dialog_cooldown_s: 30     # 해금 조건 Dialog 간격
  chart:
    step_count: 4
    steps: {1: 0.25, 2: 0.50, 3: 0.75, 4: 0.95}   # 95%를 완성으로 본다 (제안값)
    step_gold_ratio: 0.25     # 단계 골드 = 지역 시간당 골드 × 25% (제안값, 7장 6.4 '해도' 약 13,200G)
    complete_mulbineul: 2     # '7. 밸런스 기획' 7장 해도 완성 지역당 2
  treasure:
    fuzz: 48                  # 지도가 처음 보여 주는 어긋난 거리 (블록)
    exact_within: 64          # 이 안에 오면 정확한 위치
    claim_radius: 3
    dig_seconds: 3
  ship:
    starter: harbor:ship/rowboat
    summon_water_radius: 3
    summon_cooldown_s: 10
    upgrade_cost: {1: 0.10, 2: 0.20, 3: 0.30}   # 선박 가격의 10 · 20 · 30% ('13' 5.1)
    repair_kit_ratio: 0.30
    repair_kit_seconds: 5
    ice_restore_s: 60
    vanilla_accel: 0.04       # 바닐라 보트 물 위 가속 (속도 보정 기준, Phase 1 검증)
  env:
    cold: {outdoor: 1, water: 3, warm: -2, heat_radius: 4, slow_at: 60, max: 100, damage: 1, damage_interval_s: 3}
    oxygen: {max_s: 120, no_helmet_mult: 2, nautilus_mult: 0.5, recover: 5, warn_ratio: 0.2, damage: 2, pocket_radius: 3}
    heat: {boots_mult: 0.5}
  spot:
    radius: 6
    move_min_s: 600
    move_max_s: 1200
    particle_radius: 32
    radar_radius: 64
    bite_wait: 0.8            # 물고기 떼 캐스팅 입질 대기 −20%
    rare_weight: 0.10         # 희귀 가중치 +10% (상한 +60% 안에서)
    modifier_s: 45
  airship:
    interval_s: 180
    capacity: 4
    speed: 1.2                # 블록/틱
    altitude: 110
    board_radius: 6
  nautilus:
    return_after_s: 30
  housing:
    world: harbor_homes
    # server: main-1          # 하우징 월드가 다른 서버에 있으면 그 서버 ID
    cell: 40                  # 32 최대 크기 + 길 8
    base_size: 24
    large_size: 32
    large_tier: 4             # 항구의 일원
    floor_y: 64
    entity_limit: 30
    redstone_limit: 20
    anchor_limit: 12          # 플롯당 수조 자리 (Collection 전시 칸 수와 별개)
  occupancy:
    publish_s: 60
    stale_s: 180
  event:
    check_s: 60

# 야생 물고기 ('17-3' 9.3·9.4). 예산·LOD·위협 감지 값은 문서의 제안값, 나머지는 제안값 (CBT 뒤 Phase 3 부하 테스트로 조정)
wildlife:
  budget:
    target_per_player: 12        # 혼자 있을 때 주변이 비어 보이지 않는 수
    max_shown: 24                # 플레이어당 표시 상한 (마릿수)
    max_parts: 180               # 플레이어당 표시 상한 (부품). Core rig.part_budget 300 중 그림자·수족관·보스 몫을 남김
    global_max: 2000             # 서버 전체 상한
    schools_per_player_s: 2      # 플레이어당 초당 무리 2개
    spawn_per_tick: 20           # 서버 전체 틱당 20마리
    intensity: {0: 0.5, 1: 0.75, 2: 1.0}   # 연출 강도(최소·보통·최대)별 부품 예산 배율
  spawn:
    ring_min: 16                 # 플레이어 기준 16~40블록 고리
    ring_max: 40
    school_gap: 8                # 다른 무리 중심과 8블록 이상
    min_depth: 2                 # 물·용암 2칸 이상
    air_clearance: 3             # 공중 여유 3칸
    despawn: 56                  # 모든 플레이어에게서 56블록 넘게 멀어지면 제거
    small_length: 1.0            # 몸길이 1블록 미만은 작은 무리
    small_school: {min: 3, max: 6}
    large_school: {min: 1, max: 2}
    floor_per_chunk: 2           # 조개류 청크당 2개 이하
    floor_blocks: "sand,gravel,suspicious_sand,suspicious_gravel,mud,clay"
    boost: 2.0                   # 물고기 대이동 밀도 (World events.yml wildlife_boost가 우선)
    # grade_weight: fishing.grade_weight를 그대로 쓴다 (일반 60 · 고급 25 · 희귀 10 · 영웅 4, 전설·신화는 자연 스폰 없음)
  lod:
    near: 16                     # 16블록 이하: 2틱마다 전송
    show: 40                     # 40블록 초과: 숨김 (시제품 LOD 40)
    keep: 44                     # 이미 보이는 개체는 44블록까지 유지
    near_ticks: 2
    mid_ticks: 4
    mid_ticks_slow: 6            # 자동 감속 1단계
    far_hz: 2
    hidden_grace_s: 5            # 시청자가 없어진 뒤 리그 엔티티를 지우기까지
    other_parts_refresh_s: 5
  sim:
    period_ms: 100               # 계산 주기 (10Hz)
    apply_budget_ms: 1.0         # 메인 스레드 반영 예산 (틱당)
    lag_cycles: 2                # 반영이 2주기 넘게 밀리면 자동 감속
    lag_shown_scale: 0.75        # 자동 감속 2단계 표시 상한 배율
  move:
    home_radius: 24              # CRUISE 목표점 반경
    retarget_s: {min: 3, max: 6}
    dice_s: 1.0                  # 1초 ± 0.3초 주사위
    dice_jitter_s: 0.3
    idle_speed: 0.15             # 쉬기 속도 ×(1 − 0.85)
    surface_gap: 0.5             # 수면 아래 0.5블록 유지
    probe_ahead_s: 1.5           # 앞 탐침 = 속도 × 1.5초
    cruise_per_length: 2.0       # 순항 속도 = 몸길이 × 2 (블록/초)
    cruise_min: 0.6
    cruise_max: 2.2
    turn_rate: {fish: 180, ceph: 120, ray: 90, seahorse: 60, jelly: 30, clam: 0}   # 도/초
    pitch_limit: {fish: 45, ceph: 45, ray: 45, seahorse: 20, jelly: 45, clam: 0}
  school:
    radius: 4
    separation_lengths: 1.5
    separation: 1.6
    alignment: 0.8
    cohesion: 0.6
    leader: 1.0
  threat:
    sneak: 0.5                   # 웅크리면 감지 반경 ×0.5
    boat: 1.3                    # 보트에 타면 ×1.3
    closing_speed: 2.5           # 초당 2.5블록 이상 다가오면 발동
    inner_ratio: 0.35            # 반경의 35% 안이면 발동
    flee_s: {min: 3, max: 5}
    flee_speed: 1.4              # 도주 속도 ×(1 + 1.4)
    spread: 4                    # 무리 안 4블록 이내 전파
    habituate_s: 30              # 30초 안에 같은 플레이어에게 다시 놀라면
    habituate: 0.7               # 감지 반경 ×0.7
    line_break_radius: 8
  bait:
    radius: 10                   # 찌 반경 10블록
    max: 2                       # 최대 2마리
    orbit: 1.5                   # 찌 주변 1.5블록 궤도
    orbit_speed: 40              # 도/초
  air:
    band_below: 10               # 섬 높이 −10 ~ +20
    band_above: 20
    base_y: {default: 64, void_sea: 64}
    bob_speed: 0.35
    bob_period_s: 4
  grid:
    default: {min_y: 0, max_y: 96}
    harbor_main: {min_y: 20, max_y: 80}
    harbor_nether: {min_y: 10, max_y: 60}
    harbor_end: {min_y: 30, max_y: 120}
    chunks_per_tick: 4
  light:
    lava: 15                     # 용암 속 어종이 어둡지 않게 밝기 고정

sounds:
  # 리소스팩 소리(harbor:…) 사용 ('15. 사운드'). true여도 resource_pack.yml(팩의 소리 목록)에 있는 소리만 내고,
  # 나머지는 sounds.yml의 바닐라 대체 소리(fallback)를 낸다. 키가 없으면 items.custom_models를 따른다 (추가 제안)
  custom: true
