# '7. 밸런스 기획'의 수치. 서버 재시작 없이 /harbor reload balance로 다시 읽는다.

fishing:
  grade_weight:          # 4.1 등급 가중치 (지역에 없는 등급은 빼고 다시 100%로 맞춤)
    common: 60
    uncommon: 25
    rare: 10
    epic: 4
  rare_bonus_cap: 0.60   # 4.2 희귀 이상 보정 합계 상한
  legend:                # 4.3 전설 판정
    base_chance: 0.004
    pity_start: 150
    pity_step: 0.0002
    max_chance: 0.025
  mythic:
    event_chance: 0.01   # 4.4
  bite_wait_s: {min: 15, max: 35}   # 제안값 (시간당 약 80마리 목표로 CBT에서 조정)
  no_bait_wait: 1.2
  line_strength_step: 0.08          # 줄 강도 1당 텐션 한계 +8% (5장)
  ping_comp_s: 0.2                  # 핑 150ms 이상이면 패턴 예고 +0.2초
  grade_exp: {common: 5, uncommon: 12, rare: 40, epic: 150, legendary: 800, mythic: 2000}   # 3.3
  first_catch_mult: {default: 5, legendary: 3}
  region_exp_mult: {harbor: 1.0, swamp: 1.1, coral_isles: 1.3, lava_lake: 1.6, frost_fjord: 1.7, ash_trench: 1.9, void_sea: 2.2}
  minigame:                         # 5장. 텐션 상승·틱당 감기는 제안값
    release_rate: 0.03
    reel_per_tick: 1.6
    safe_low: 0.25
    safe_width: 0.45
    escape_ticks: 40
    common: {hp: 100, tension_rise: 0.012, patterns: 0}
    uncommon: {hp: 180, tension_rise: 0.018, patterns: 1, pattern_interval_s: 4}
    rare: {hp: 350, tension_rise: 0.022, patterns: 2, pattern_interval_s: 3}
    epic: {hp: 600, tension_rise: 0.030, patterns: 3, pattern_interval_s: 2.5}
    legendary: {hp: 1200, tension_rise: 0.035, patterns: 4, pattern_interval_s: 2}
  quality:               # 4.5 품질 경계 (백분위)
    star2: 0.40
    star3: 0.70
    star4: 0.90
    star5: 0.98
    tier_cap: [3, 4, 5]  # 직업 단계별 품질 상한

economy:
  market:                # 6.2 시세 계수 M = clamp(1 − 0.35 × (S/S₀ − 1), 0.5, 1.2)
    slope: 0.35
    min: 0.5
    max: 1.2
    window_h: 24
    s0_floor: 20           # 제안값
    catches_per_hour: 80
    sell_ratio: 0.85
  quality_mult: {1: 1.0, 2: 1.2, 3: 1.5, 4: 2.5, 5: 5.0}   # ★4·★5는 제안값 (docs 20 7.4)
  region_factor: {void_sea: 0.65}
  legend_cap: 3000
  repair: {rate: 0.03, broken_rate: 0.10}

# 보정자 스탯: 기본값·하한·상한 (/harbor stat에서 확인)
stats:
  rare_weight:
    base: 0
    max: 0.60
  bite_wait:
    base: 1.0
    min: 0.2
  sell_price:
    base: 1.0
    min: 0
  reel_speed:
    base: 1.0
    min: 0.1
  line_strength:
    base: 0
    min: 0
  exp_gain:
    base: 1.0
    min: 0
  tension_safe_zone:
    base: 1.0
    min: 0.2
  size_luck:
    base: 0
  bait_save_chance:
    base: 0
    max: 1
  pattern_warn:
    base: 0
  first_catch_exp_bonus:
    base: 0
  uncaught_weight:
    base: 0
  epic_weight:
    base: 0
  legend_pity_start:
    base: 0
  legend_chance:
    base: 1.0
  cast_distance:
    base: 1.0
  shop_buy_price:
    base: 1.0
    min: 0.5
  repair_cost:
    base: 1.0
    min: 0
  market_info:
    base: 0

# 개발 서버의 월드 이름을 지역 월드(harbor_main 등)에 대응시킨다 (운영 서버는 비움)
world_alias:
  world: harbor_main

items:
  fish_base_item: minecraft:cod
  # tooltip_style:       # 등급별 툴팁 테두리 (리소스팩 준비 후)
  #   legendary: harbor:legendary

# 직업 ('7. 밸런스 기획' 3장, docs 20 2.3)
jobs:
  exp_formula: {coef: 2, exp: 2.05, round: 10}   # Lv L → L+1 필요 EXP = 2 × L^2.05
  max_level: 70
  tier_level_cap: {1: 30, 2: 60, 3: 70}
  quality_cap: {1: 3, 2: 4, 3: 5}
  advance_cost: {2: 15000, 3: 90000}
  line_change_cost: {2: 30000, 3: 80000}
  refund_ratio: 0.8
  common_reset_cost: 5000
  region_decay: {gap: 15, mult: 0.5}
  catchup:
    week5: {week: 5, gap: 10, bonus: 0.5}
    week9: {week: 9, gap: 10, bonus: 1.0}
  tier_first_quality_bonus: 2   # 제안값
  tier_points: {2: 8, 3: 30}
  capstone_requires: 60
  other_line_limit: 40
  curve_check: {10: 620, 20: 5640, 30: 19940, 40: 48560, 50: 96650, 60: 169410, 70: 272120}
