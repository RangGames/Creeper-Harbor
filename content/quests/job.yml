# 전직 퀘스트 (docs 20 6.4 전직 퀘스트, '7. 밸런스 기획' 2장). 시작·완료 NPC는 길드 마스터 바위.
# 마지막 보고에서 Jobs requestAdvance(확인 Dialog·2차 계열 선택·골드 차감·전직 컷씬) → JobAdvancedEvent로 완료, 물비늘 5 ('7. 밸런스 기획' 7장 회당 5).
- id: quest/job/second_advance
  name: 2차 전직 · 바다를 읽는 법
  type: job
  description:
    - 바위가 2차 전직 시험을 내준다. "물고기를 많이 잡는 것보다, 언제 어디서 잡을지 아는 게 어부다."
  requires: {level: 30, job_tier: 1}
  start_npc: npc/bawi
  end_npc: npc/bawi
  objectives:
    - {key: uncommon, type: catch, target: "grade:uncommon+", count: 10}
    - {key: storm_bass, type: catch, target: fish/storm_sea_bass, count: 1, quality_min: 3}
    - {key: deliver, type: deliver, target: fish/breakwater_rockfish, count: 2}
  rewards:
    mulbineul: 5
    exp: 500
    job_advance: 2

- id: quest/job/third_advance
  name: 3차 전직 · 바다의 기억
  type: job
  description:
    - 바위가 마지막 시험을 내준다. 6주차에 열린다.
  requires: {level: 60, job_tier: 2, week: 6}
  start_npc: npc/bawi
  end_npc: npc/bawi
  objectives:
    - {key: rare, type: catch, target: "grade:rare+", count: 10}
    - {key: quality, type: catch, target: any, count: 5, quality_min: 4}
  rewards:
    mulbineul: 5
    exp: 2000
    job_advance: 3
