- id: dialog/morae
  entries:
    - {conditions: [{affinity_min: {level: 3}}], node: secret}
    - {node: greet}
  nodes:
    greet:
      pages: [npc.dialog.morae.greet.1]
      options:
        - {label: npc.dialog.option.quests, actions: [quest:list]}
        - {label: npc.dialog.option.gift, actions: [gift:open]}
        - {label: npc.dialog.option.bye, actions: [close]}
    secret:
      pages: [npc.dialog.morae.secret.1, npc.dialog.morae.secret.2]
      options:
        - {label: npc.dialog.option.quests, actions: [quest:list]}
        - {label: npc.dialog.option.gift, actions: [gift:open]}
        - {label: npc.dialog.option.bye, actions: [close]}
