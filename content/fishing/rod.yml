# 낚싯대 부품·전용 인챈트 (Harbor-Fishing, 추가 제안 파일).
# 부품(낚싯줄·찌·릴, items의 type: line·float·reel)은 /낚싯대로 손에 든 낚싯대에 자리마다 하나씩 단다 ('8. 시스템 상세 기획' 2장 낚싯대 PDC).
# 단 부품과 인챈트의 stats는 낚싯대 stats에 더해 판정·미니게임에 쓰인다.
#
# 전용 인챈트 ('8. 시스템 상세 기획' 6장): 인챈트 테이블에는 나오지 않고 낚시용품점 NPC(대화 액션 fishing:enchant)에서만 골드로 부여한다.
# 가격은 '13. 제작 · 상점 가격' 5.1 (I 1,500 / II 4,000 / III 8,000). 높은 단계를 바로 살 수 있고, 이미 가진 단계가 있으면 차액만 낸다 (추가 제안).
# 단계별 효과 값은 문서에 없어 제안값이다. 새 낚싯대는 인챈트 없이 시작하고, 낚싯대를 바꾸면 새로 부여한다.
#   stat: 더할 스탯 키 (bite_wait: 입질 대기 비율, line_strength: 줄 강도)
#   values: 단계별 값 (I, II, III 순), prices: 단계별 가격

enchants:
  - id: tide_reading            # 조류 읽기: 입질 대기 감소
    stat: bite_wait
    values: [-0.05, -0.10, -0.15]   # 제안값
    prices: [1500, 4000, 8000]
  - id: firm_knot               # 단단한 매듭: 줄 강도
    stat: line_strength
    values: [1, 2, 3]               # 제안값
    prices: [1500, 4000, 8000]

# 이빨 있는 어종(tags: toothy)이 걸렸을 때 줄이 이빨을 견디지 못하면(bite_proof 스탯 없음) 줄 강도에서 뺄 값 (제안값).
# 강철 와이어 줄(stats bite_proof: 1)을 달면 빠지지 않는다 ('3. 아이템 목록' 2장 "이빨 있는 어종 줄 끊김 방지").
toothy_line_penalty: 2
