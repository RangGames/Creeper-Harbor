# 등급별 낚시 연출 프리셋 (docs 20 3.3 FishingPreset, '4. 낚시 연출 & 보스전' 1장).
# shadow_rig: 어종 리그(rig/fish/<어종 이름>)가 없을 때 쓰는 그림자 리그. 리그가 없으면 shadow_model 아이템 하나로 그린다
# shadow_scale: 그림자 크기 (전설은 배보다 크게) · glow: 그림자 감별(feature_shadow_grade) 테두리 색
# bite·catch.flags: darkness title shake pillar firework dialog nearby flop
# flop: 포획 때 어종 리그(rig/fish/<이름>)의 flop 동작으로 물고기가 손 위에서 퍼덕인다 ('4. 낚시 연출 & 보스전' 1장 일반~고급). 리그가 없으면 생략
# bite·catch.sound: 리소스팩 소리 harbor:<이벤트> ('15. 사운드' 4.1·4.2). 팩을 쓰지 않거나 팩에 없으면 sound_fallback(없으면 sounds.yml fallback)을 낸다.
#   입질은 찌 위치에서, 포획음은 본인에게 2D로 낸다. 포획 때는 sounds.reel_in(위치)이 먼저, flop이면 sounds.flop도 낸다.
# sounds: 등급과 상관없는 단계 소리 (추가 제안). 비운 단계는 기본값(harbor:fishing.*), 빈 문자열("")이면 소리 없음
#   cast 던짐 · land 찌 착수 · land_lava 용암 착수 · land_ice 얼음 구멍 착수 · hook 챔질 · reel_loop Shift 감는 동안(반복)
#   tension_warn 텐션 경고(위험 구간 진입) · line_snap 줄 끊김 · reel_in 낚아 올림 · flop 퍼덕임 · escape 놓침(일반~고급) · escape_big 놓친 대어(희귀 이상)

sounds:
  cast: "harbor:fishing.cast"
  land: "harbor:fishing.bobber_land"
  land_lava: "harbor:fishing.lava_cast"
  land_ice: "harbor:fishing.ice_hole"
  hook: "harbor:fishing.hook"
  reel_loop: "harbor:fishing.reel_loop"
  tension_warn: "harbor:fishing.tension_warn"
  line_snap: "harbor:fishing.line_snap"
  reel_in: "harbor:fishing.reel_in"
  flop: "harbor:fishing.flop"
  escape: ""
  escape_big: "harbor:fishing.miss_big"

grades:
  common:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 0.6
    bite: {sound: "harbor:fishing.bite", particle: splash, count: 8}
    catch: {sound: "harbor:catch.common", particle: splash, count: 10, flags: [flop]}
  uncommon:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 0.8
    glow: "#55ff55"
    bite: {sound: "harbor:fishing.bite", particle: splash, count: 12}
    catch: {sound: "harbor:catch.common", particle: splash, count: 14, flags: [flop]}
  rare:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 1.0
    glow: "#3b82f6"
    bite: {sound: "harbor:fishing.bite", particle: bubble_pop, count: 20, flags: [shake]}
    catch: {sound: "harbor:catch.rare", particle: end_rod, count: 20, flags: [pillar, nearby]}
  epic:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 1.4
    glow: "#a855f7"
    bite: {sound: "harbor:fishing.bite", sound_fallback: "minecraft:block.bell.use", particle: bubble_pop, count: 30, flags: [shake]}
    catch: {sound: "harbor:catch.rare", sound_fallback: "minecraft:ui.toast.challenge_complete", particle: end_rod, count: 30, flags: [pillar, nearby, dialog]}
  legendary:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 3.0
    glow: "#f5c542"
    bite: {sound: "harbor:catch.legendary_bite", particle: bubble_column_up, count: 40, flags: [darkness, title, shake]}
    catch: {sound: "harbor:catch.legendary", particle: totem_of_undying, count: 60, flags: [pillar, firework, nearby, dialog]}
  mythic:
    shadow_rig: rig/fish/shadow_small
    shadow_model: harbor:rig/shadow/small
    shadow_scale: 3.5
    glow: "#ff4fd8"
    bite: {sound: "harbor:catch.legendary_bite", particle: bubble_column_up, count: 50, flags: [darkness, title, shake]}
    catch: {sound: "harbor:catch.mythic", particle: totem_of_undying, count: 80, flags: [pillar, firework, nearby, dialog]}

# 연출 강도(/낚시 설정)별로 생략할 항목: 0 최소 · 1 보통 · 2 최대
intensity:
  0: [darkness, shake, pillar, firework, dialog, jump_viewers, shadow, flop]
  1: [darkness, firework, jump_viewers]
  2: []
