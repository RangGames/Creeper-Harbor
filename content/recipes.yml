# 제작 레시피 ('11. 데이터 설계' 2.3·2.9, '13. 제작 · 상점 가격' 3장, docs 20 7.3·7.4). Harbor-Economy.
# station: workshop(어부 길드 작업대) · cooking(요리 화로) · shipyard(조선소), category: gear · bait · food · trap · boat
# ingredients: {item: <아이템 ID>} · {vanilla: <바닐라 키>}(추가 제안) · {match: {grade_min, fish_any, region}} + count
# unlock: job_tier · level · visited(플레이어 플래그 visited/<지역>, World가 세움) · quest(quest/<경로>, Quest가 세움) ·
#         feature(스킬이 올리는 보정자 키) · flags (모두 추가 제안 규칙: 해금 판정은 플래그·보정자로만 한다)
# weekly_limit: Season weekly_counter 키 craft:<레시피 이름>
# 보스 비늘(보스 보상 재료)이 들어가는 레시피(심해 수압 낚싯대·심해 기어 릴·심해 통발·고래잡이 작살·보스 소환 미끼)와
# 전설의 미끼의 보스 비늘 5개는 Harbor-Boss가 보스 비늘 아이템을 만든 뒤 추가한다.

