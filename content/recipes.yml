# ---------------------------------------------------------------- 요리 화로 (결과는 Fishing 요리, 버프는 fishing/food.yml)
- id: recipe/grilled_fish
  result: item/food/grilled_fish
  station: cooking
  category: food
  ingredients:
    - {match: {grade_min: common}, count: 1}       # 일반 어종 1 (아무 어종)

- id: recipe/spicy_stew
  result: item/food/spicy_stew
  station: cooking
  category: food
  ingredients:
    - {match: {fish_any: [fish/harbor_rockfish, fish/breakwater_rockfish]}, count: 1}   # 우럭·메기 중 1 (메기는 늪지 어종이 생기면 추가)
    - {vanilla: minecraft:brown_mushroom, count: 1}
    - {vanilla: minecraft:potion, count: 1}        # 물병

- id: recipe/sashimi_platter
  result: item/food/sashimi_platter
  station: cooking
  category: food
  ingredients:
    - {match: {grade_min: rare}, count: 1}         # 희귀 이상 어종 1
    - {match: {grade_min: common}, count: 2}       # 일반 어종 2

- id: recipe/fjord_soup
  result: item/food/fjord_soup
  station: cooking
  category: food
  ingredients:
    - {match: {region: region/frost_fjord}, count: 2}   # 서리 협만 어종 2
    - {vanilla: minecraft:potato, count: 1}

# 행운의 차 (반딧불 은어 1, 설탕 1, 물병 1)는 늪지 어종 '반딧불 은어'가 콘텐츠에 생기면 추가한다.
