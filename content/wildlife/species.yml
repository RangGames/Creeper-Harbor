# 야생 어종 이동 값 ('17-3' 9.3, 추가 제안 형식). 어종(fish/*.yml)마다 항목 하나.
# 비운 값은 자동으로 채운다: 성향 = 고유 동작의 group, 순항 속도 = 몸길이 × 2 (0.6~2.2블록/초), 회전 속도·기울기 = 템플릿 기본,
# 무리 = 몸길이 1블록 미만 3~6마리 / 이상 1~2마리, 위협 반경 = 성향 값. 디자이너는 덮어쓸 값만 적는다.
# 리그: rig가 없으면 어종 리그 rig/fish/<모델 이름>(fish/*.yml model의 harbor:fish/<이름>, Fishing·Collection과 같은 규칙), 그것도 없으면 rig/wild/<템플릿>.
# 어종 리그는 어종 크기(size_cm 가운데 값)에 맞춰 그린다 (scale은 그 위에 곱함). special은 어종 리그의 고유 동작 이름과 같아야 재생된다.
# 자연 스폰 후보는 어종 YAML의 지역·시간·날씨·달·세부 구역 조건을 그대로 따른다 (야생에서 보이는 어종 = 지금 낚이는 어종).
# 전설·신화는 자연 스폰하지 않는다 (spawnScripted 연출 전용).
#
# 필드: id(wild/…), fish_id, template(fish · ceph · ray · seahorse · jelly · clam), medium(water · lava · air · floor),
#       special, group, cruise_speed, turn_rate, depth[수면 아래 최소, 최대], school[최소, 최대], spawn_weight,
#       threat_radius, rig, scale, enabled

