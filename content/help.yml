# 플레이어 /도움말 목록 (추가 제안). Core가 적은 순서대로 보여 준다.
# 서버에 없는 명령(그 서버에서 꺼진 모듈)과 쓸 권한이 없는 명령은 자동으로 감추므로, 모든 서버에 같은 파일을 둔다.
#
#   command  클릭 때 넣을 명령 (앞의 / 없이). <인자>가 있으면 그 앞까지만 입력창에 넣는다
#   text     설명 (MiniMessage)
#   run      true = 클릭 즉시 실행, false = 입력창에 넣기만. 비우면 <인자>가 없을 때 true

sections:
