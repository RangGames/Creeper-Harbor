      job_reset: "스킬 초기화"
      teaching: "가르침을 청한다"
      green_light: "초록 불빛에 대해 묻는다"
      brother: "형님에 대해 묻는다"
      ritual: "첫 물고기 방류 의식"
      memory: "그날 밤을 떠올린다"
      rumor: "소문을 묻는다"
    hansol:
      first_meet:
        1: "…폭풍에 떠밀려 왔다고? 운이 좋았군."
        2: "여기는 크리퍼 항구다. 밤에 초록 불빛을 보거든 가까이 가지 마라."
      greet:
        1: "오늘도 바다가 잔잔하군. 할 일이 있으면 길드의 바위에게 가 보게."
      greet_friend:
        1: "<player>, 자네 덕에 항구가 조금은 북적이는군."
      green_light:
        1: "초록 불빛… 30년 전 그날 밤, 그 빛이 항구를 무너뜨렸지."
        2: "내 형님은 그날 등대를 지키다 돌아오지 못했네."
      brother:
        1: "형님이 살아 있었다고…? 그 늪지의 노인이…"
      after_climax:
        1: "등대가 다시 켜졌네. 형님과 함께 보는 불빛이라니, 꿈만 같군."
    bawi:
      first_meet:
        1: "하하! 새 얼굴이군. 내가 이 항구 어부 길드의 바위다!"
        2: "낚시는 필요한 만큼만. 이것만 지키면 바다는 늘 너그럽지."
      greet:
        1: "또 왔나! 오늘은 무엇을 배워 볼 텐가?"
      teaching:
        1: "줄이 팽팽해지면 힘을 빼라. 물고기와 싸우는 게 아니라 같이 춤을 추는 거다."
        2: "그리고 잊지 마라. 필요한 만큼만이다."
    iseul:
      greet:
        1: "어서 오세요. 항구의 기록을 모으는 이슬이에요. 수족관을 함께 채워 주실래요?"
      ritual:
        1: "옛 기록에 '첫 물고기 방류 의식'이라는 게 있어요."
        2: "수족관이 가득 차면, 그 의식을 다시 열 수 있을지도 몰라요."
    aquarium_keeper:
      greet:
        1: "수족관이 넓어져서 제가 새로 왔어요! 물고기들 밥은 제가 챙길게요."
    fish_market:
      greet:
        1: "싱싱한 놈이면 값을 잘 쳐주지! 오늘 시세는 게시판을 보라고."
    tackle_keeper:
      greet:
        1: "미끼, 낚싯대, 찌! 필요한 건 다 있어요."
    shipwright:
      greet:
        1: "배가 상했으면 고쳐 주고, 더 먼 바다로 가려면 새로 지어 주지."
    hermit:
      greet:
        1: "…초록 빛은 원수가 아니야."
      green_light:
        1: "바다에게 물어봐라. 바다는 다 기억하고 있다."
      riddle:
        1: "그날 밤 내가 본 것을 아무도 믿지 않았지."
        2: "해일 앞으로 헤엄쳐 가던 그 녀석들을… 너는 믿겠느냐?"
      revealed:
        1: "그래, 내가 한결이다. 이 항구 등대를 지키던."
        2: "한솔에게는… 아직 말하지 못했다."
      after_memory:
        1: "그 녀석들이 우리를 살렸다. 그게 그날 밤의 진실이야."
    hangyeol:
      greet:
        1: "30년 만에 켜진 불빛이다."
        2: "<player>, 고맙다. 네가 진실을 모아 주지 않았다면 여기까지 오지 못했을 거다."
    coral:
      greet:
        1: "느긋하게 쉬어 가요. 섬에서는 바다가 시간을 정하니까."
      secret:
        1: "우리 섬 사람들은 30년 동안 한 번도 약속을 어기지 않았어요."
        2: "매년 첫 물고기는 바다로 돌려보내죠. 그게 바다와의 약속이니까."
    seori:
      greet:
        1: "…북쪽 바다는 차갑다. 조심해."
      secret:
        1: "얼음 속에 지켜 온 것이 있다."
        2: "녀석들은 그날 밤 너희 항구를 위해 죽었어."
    morae:
      greet:
        1: "해구 바닥에 뭔가 있어요! 분명 사람이 지은 거라니까요!"
      secret:
        1: "해저 유적의 문양… 옛 왕궁의 것과 똑같아요."
        2: "가라앉은 건 왕궁이었던 거예요."
    peddler:
      greet:
        1: "어이 거기! 이번에만 파는 물건이 있다네."
      rumor:
        1: "뇌우 치는 밤이면 낡은 배 한 척이 보인다더군. 선장이 혼잣말을 한다나."
    captain:
      first_meet:
        1: "…이 바다도 많이 변했군."
        2: "왕의 깃발 아래에서 그물을 내리던 시절이 있었지."
      greet:
        1: "폭풍이 그치면 나도 사라질 거다."
