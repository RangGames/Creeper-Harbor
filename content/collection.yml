# 도감 보상 (추가 제안, docs 20 4.3·4.4). 칭호는 Season, 치장품은 Shop이 CollectionMilestoneEvent로 지급한다.

first_catch:            # 희귀 이상 첫 포획 물비늘 ('7. 밸런스 기획' 7장: 종당 1)
  min_grade: rare
  mulbineul: 1

region_complete:        # 지역 완성 (시즌 도감, 신화 제외): 칭호 + 물비늘 3
  mulbineul: 3
  title_prefix: codex_region

total_milestones:       # 누적 달성률 (성능 버프 없음)
  - {percent: 25, title: codex_25}
  - {percent: 50, title: codex_50}
  - {percent: 75, title: codex_75}
  - {percent: 100, title: codex_100}

season_buffs:           # 시즌 도감 버프 (제안값, 출처 collection_season)
  - {percent: 20, modifiers: [{stat: exp_gain, value: 0.02}]}
  - {percent: 40, modifiers: [{stat: sell_price, value: 0.02}]}
  - {percent: 60, modifiers: [{stat: rare_weight, value: 0.03}]}
  - {percent: 80, modifiers: [{stat: exp_gain, value: 0.03}]}
