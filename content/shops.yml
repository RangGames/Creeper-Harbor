# NPC 상점 (추가 제안, docs 20 7.3). price가 없으면 아이템 buy_price ('13. 제작 · 상점 가격' 2장).
# npc: 대화 액션 shop:open이 이 NPC의 상점을 연다 (npcs.yml의 shop 필드가 먼저). 가격 × shop_buy_price × (1 − 호감도 할인).
# vanilla: 바닐라 재료 고정가 ('13. 제작 · 상점 가격' 4장, 제안값), 1인 하루 64개 한도 (제안값).
# requires: {job_tier, line, visited: <지역 ID>, quest: <퀘스트 ID>} — visited·quest는 플레이어 플래그로 판정 (추가 제안).

