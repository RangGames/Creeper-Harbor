# ---------------------------------------------------------------- 떠돌이 (Phase 3)
- id: npc/peddler
  name: "<gold>떠돌이 행상 보따리"
  role: wanderer
  skin: harbor:entity/npc/peddler
  dialog: dialog/peddler
  dialog_style: hologram               # 머리 위 말풍선 + 채팅 버튼 (재클릭으로 넘김, 추가 제안)
  schedule:
    slot_hours: 3
    announce: true                    # 도착을 harbor:announce로 알린다
    candidates:
      - {id: market_square, location: {world: harbor_main, x: 0.5, y: 64, z: 40.5, yaw: 0}, weight: 40}
      - {id: lighthouse_hill, location: {world: harbor_main, x: -14.5, y: 72, z: -50.5, yaw: 180}, weight: 20}
      - {id: swamp_dock, location: {world: harbor_main, x: 200.5, y: 63, z: 120.5, yaw: 90}, weight: 20}
      - {id: coral_beach, location: {world: harbor_main, x: 360.5, y: 64, z: -240.5, yaw: 270}, weight: 20}

- id: npc/captain
  name: "<dark_aqua>수상한 선장"
  role: wanderer
  skin: harbor:entity/npc/captain
  dialog: dialog/captain
  schedule:
    slot_hours: 3
    announce: false                   # 선장은 알리지 않는다
    candidates:                       # 밤 + 폭풍에만 나타나는 히든 퀘스트 시작점
      - {id: old_pier, location: {world: harbor_main, x: 70.5, y: 63, z: -80.5, yaw: 0}, time: [night], weather: [thunder]}
      - {id: breakwater_end, location: {world: harbor_main, x: 120.5, y: 63, z: -140.5, yaw: 90}, time: [night], weather: [thunder]}
