# 명예의 전당 (docs 20 11.4). 진행 중에는 잠정 기록, 시즌 전환 SNAPSHOT 단계에서 아카이브 데이터로 다시 계산해 확정하고 칭호를 준다.
# source: records (Collection submit) · boss_records (Boss submit) · level_first · codex_first (데이터로 계산) · submitted (제출 그대로)
# rule: top1 (대상별 1위) · first_n (선착순 count명) · all (제출 전원, 추가 제안)
# title에 <subject>를 쓰면 대상 이름으로 바뀐다 (예: title/hof_fish/<subject>)

categories:
  - category: biggest_fish
    name: "<gold>어종별 서버 최대어"
    source: records
    rule: top1
    order: desc
    unit: cm
    title: title/hof_master_angler

  - category: fastest_boss
    name: "<red>보스 최단 처치"
    source: boss_records
    rule: top1
    order: asc
    unit: time_ms
    title: title/hof_boss_slayer

  - category: level_first
    name: "<yellow>시즌 레벨 70 선착순"
    source: level_first
    rule: first_n
    count: 10            # 제안값 (docs 20 11.8 열린 질문)
    level: 70
    title: title/hof_level_pioneer

  - category: codex_first
    name: "<aqua>시즌 도감 완성 선착순"
    source: codex_first
    rule: first_n
    count: 10            # 제안값
    unit: 종
    title: title/hof_codex_pioneer

  - category: lighthouse
    name: "<white>등대를 밝힌 자"
    source: submitted
    rule: all            # 클라이맥스 참여자 명단 (칭호는 Boss가 바로 준다)
