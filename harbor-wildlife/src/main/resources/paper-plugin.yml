name: Harbor-Wildlife
version: '${version}'
main: wiki.creeper.harbor.wildlife.HarborWildlifePlugin
api-version: '${apiVersion}'
description: '야생 물고기 AI'
dependencies:
  server:
    Harbor-Core:
      load: BEFORE
      required: true
      join-classpath: true
    Harbor-Fishing:
      load: BEFORE
      required: true
      join-classpath: true
    Harbor-World:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  harbor.admin.wildlife.wild:
    description: '/harbor wildlife spawn · clear · debug · stats · budget'
    default: op
